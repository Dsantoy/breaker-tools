    async function gql(apiKey,query,variables={}){const res=await fetch(MONDAY_API,{method:"POST",headers:{"Content-Type":"application/json",Authorization:apiKey},body:JSON.stringify({query,variables})});if(!res.ok)throw new Error(`HTTP ${res.status}`);const json=await res.json();if(json.errors)throw new Error(json.errors[0].message);return json.data;}

      return(<div style={{minHeight:"100vh",background:C.light,padding:"24px 16px"}}><div style={{maxWidth:740,margin:"0 auto"}}><div style={{background:C.primary,borderRadius:12,padding:"18px 28px",marginBottom:20,display:"flex",alignItems:"center",gap:14}}><div style={{width:40,height:40,background:"rgba(255,255,255,0.15)",borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><svg width="20" height="20" fill="none" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke="#fff" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"/></svg></div><div><div style={{color:"#fff",fontSize:18,fontWeight:700}}>Breaker Slot Request Form</div><div style={{color:"rgba(255,255,255,0.65)",fontSize:12,marginTop:2}}>Burns &amp; McDonnell · PO 280865 · Wesco/GE/Hitachi HV Breaker Program</div></div></div><div style={crd}><div style={sh}>① Project Details</div><div style={g2}><div><label style={lbl}>Project Name <span style={{color:C.danger}}>*</span></label><input value={form.projectName} onChange={e=>setForm(f=>({...f,projectName:e.target.value}))} style={inp} placeholder="e.g. Riverside Substation Expansion"/></div><div><label style={lbl}>Client Name <span style={{color:C.danger}}>*</span></label><input value={form.clientName} onChange={e=>setForm(f=>({...f,clientName:e.target.value}))} style={inp} placeholder="e.g. Pacific Gas &amp; Electric"/></div></div><div style={g2}><div><label style={lbl}>Requester <span style={{color:C.danger}}>*</span></label><select value={form.requesterId} onChange={e=>setForm(f=>({...f,requesterId:e.target.value}))} style={inp}><option value="">Select your name…</option>{users.map(u=><option key={u.id} value={u.id}>{u.name}{u.email?` (${u.email})`:""}</option>)}</select></div><div><label style={lbl}>Opportunity Number <span style={{color:C.danger}}>*</span></label><input value={form.opportunityNumber} onChange={e=>setForm(f=>({...f,opportunityNumber:e.target.value}))} style={inp} placeholder="e.g ption key={l.id} value={l.id}>{`Line ${String(l.poLineNum).padStart(2,"0")} — ${l.voltage}kV ${l.manufacturer} — Delivery ${l.deliveryDate} — ${l.availableQty} avail`}</option>))}</select>{selectedPoLineId&&(<div style={{marginTop:22}}>{subLoad?(<div style={{textAlign:"center",padding:28,color:"#64748b"}}>Loading breaker units…</div>):(<>{(()=>{let bg,bc,color,msg;if(available.length===0){bg="#fef2f2";bc="#fecaca";color=C.danger;msg="⚠️ No available breakers on this line.";}else if(selectedIds.length===0){bg="#fff7ed";bc="#fed7aa";color=C.warn;msg=`${available.length} breaker${available.length!==1?"s":""} available — select units below.`;}else{bg="#f0fdf4";bc="#86efac";color=C.green;msg=`✓ ${selectedIds.length} of ${available.length} selected.`;}return<div style={{background:bg,border:`1px solid ${bc}`,borderRadius:8,padding:"10px 14px",marginBottom:14,fontSize:13,color,fontWeight:500}}>{msg}</div>;})()}{available.length>0&&(<div style={{border:"1px solid #e2e8f0",borderRadius:8,overflow:"hidden"}}><div style={{background:"#f8fafc",padding:"8px 14px",fontSize:11,fontWeight:700,color:"#475569",letterSpacing:"0.06em",borderBottom:"1px solid #e2e8f0",display:"flex",alignItems:"center",justifyContent:"space-between"}}><span>AVAILABLE UNITS</span><span style={{fontWeight:400,color:"#94a3b8"}}>{selectedIds.length}/{available.length} selected</span></div>{available.length>1&&(<div style={{padding:"8px 14px",borderBottom:"1px solid #e2e8f0",display:"flex",gap:12}}><button onClick={()=>setSelectedIds(available.map(s=>s.id))} style={{fontSize:12,color:C.primary,background:"none",border:"none",cursor:"pointer",padding:0,fontWeight:500}}>Select all {available.length}</button><span style={{color:"#e2e8f0"}}>|</span><button onClick={()=>setSelectedIds([])} style={{fontSize:12,color:"#64748b",background:"none",border:"none",cursor:"pointer",padding:0}}>Clear all</button></div>)}{available.map((b,i)=>{const checked=selectedIds.includes(b.id);return(<label key={b.id} style={{display
