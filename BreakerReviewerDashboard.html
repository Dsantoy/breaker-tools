<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BSF Review Dashboard — Burns & McDonnell</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    select, input, textarea, button { font-family: inherit; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    const MONDAY_API        = "https://api.monday.com/v2";
    const REQUESTS_BOARD_ID = 18422875681;
    const SUBITEMS_BOARD_ID = 18426331487;
    const SLOT_BOARD_ID     = 18422871700;
    const SUMMARY_BOARD_ID  = 18426507360;
    const SUMMARY_ITEM = { "145": 12798947432, "245": 12798972935, "362": 12798947735 };
    const SUMMARY_COL  = { available: "numeric_mm66a4e7", reserved: "numeric_mm66w5v7" };

    async function gql(apiKey, query, variables = {}) {
      const res = await fetch(MONDAY_API, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: apiKey },
        body: JSON.stringify({ query, variables }),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      if (json.errors) throw new Error(json.errors[0].message);
      return json.data;
    }

    function colVal(cvs, id)  { return cvs?.find(c=>c.id===id)?.text || ""; }
    function colRaw(cvs, id)  { const r=cvs?.find(c=>c.id===id)?.value; try{return r?JSON.parse(r):null;}catch{return null;} }

    const C  = { primary:"#003087", green:"#00703C", danger:"#dc2626", warn:"#d97706", border:"#e2e8f0", light:"#f8fafc" };
    const lbl = { display:"block", fontSize:13, fontWeight:600, color:"#374151", marginBottom:5 };
    const inp = { width:"100%", padding:"9px 12px", border:`1px solid ${C.border}`, borderRadius:7, fontSize:14, color:"#1e293b", outline:"none", background:"#fff" };
    const crd = { background:"#fff", borderRadius:12, boxShadow:"0 1px 8px rgba(0,0,0,0.08)", padding:"22px 26px", marginBottom:18 };
    const eb  = { background:"#fef2f2", border:`1px solid #fecaca`, color:C.danger, borderRadius:8, padding:"10px 14px", fontSize:13, marginBottom:14 };
    const pill= (color,bg) => ({ display:"inline-flex",alignItems:"center",fontSize:11,fontWeight:700,color,background:bg,padding:"2px 9px",borderRadius:99,whiteSpace:"nowrap" });
    const btp = (color,dis) => ({ background:dis?"#94a3b8":color, color:"#fff", border:"none", borderRadius:7, padding:"9px 18px", fontSize:13, fontWeight:600, cursor:dis?"not-allowed":"pointer", opacity:dis?0.6:1 });
    const bto = { background:"#f1f5f9", color:"#334155", border:`1px solid ${C.border}`, borderRadius:7, padding:"8px 16px", fontSize:13, fontWeight:500, cursor:"pointer" };

    function App() {
      const [apiKey,      setApiKey]       = useState("");
      const [setupLoad,   setSetupLoad]    = useState(false);
      const [setupErr,    setSetupErr]     = useState("");
      const [screen,      setScreen]       = useState("setup");
      const [requests,    setRequests]     = useState({ pending:[], history:[] });
      const [loading,     setLoading]      = useState(false);
      const [loadErr,     setLoadErr]      = useState("");
      const [actionState, setActionState]  = useState({});
      const [denyTarget,  setDenyTarget]   = useState(null);
      const [denyReason,  setDenyReason]   = useState("");

      const handleSetup = async () => {
        if (!apiKey.trim()) { setSetupErr("API key is required."); return; }
        setSetupErr(""); setSetupLoad(true);
        try {
          await gql(apiKey, `{ me { id } }`);
          setScreen("dashboard");
          loadRequests(apiKey);
        } catch(e) { setSetupErr("Connection failed: "+e.message); }
        finally { setSetupLoad(false); }
      };

      const loadRequests = useCallback(async (key = apiKey) => {
        setLoading(true); setLoadErr("");
        try {
          const boardData = await gql(key, `{
            boards(ids:[${REQUESTS_BOARD_ID}]) {
              items_page(limit:100) {
                items {
                  id name
                  column_values(ids:[
                    "text_mm5es7sz","short_texthrb2ladn","peopleda149l5r",
                    "short_textfukcenx9","numeric_mm5es9c9","status",
                    "number8jhwmqe9","single_selectjej2zay","date3z59ugdu",
                    "text_mm66tjan","board_relation_mm5e11py","formula_mm5s2fxb"
                  ]) { id text value }
                }
              }
            }
          }`);

          const allItems = boardData.boards[0].items_page.items;
          const pending  = allItems.filter(i=>colVal(i.column_values,"status")==="Working on it");
          const history  = allItems.filter(i=>["Done","Stuck"].includes(colVal(i.column_values,"status")));

          // Collect all unique breaker IDs
          const allIds = [];
          pending.forEach(item => {
            colVal(item.column_values,"text_mm66tjan").split("|").filter(Boolean).forEach(id=>allIds.push(id));
          });
          const uniqueIds = [...new Set(allIds)].map(Number).filter(Boolean);

          // Batch fetch subitem details
          let subMap = {};
          if (uniqueIds.length > 0) {
            const subData = await gql(key, `{ items(ids:[${uniqueIds.join(",")}]) { id name column_values(ids:["status","dropdown_mm65b542","dropdown_mm65c7mt","date_mm65h7tw"]) { id text } parent_item { id name } } }`);
            subData.items.forEach(si => {
              const cols = {};
              si.column_values.forEach(c=>{cols[c.id]=c.text;});
              subMap[si.id] = { id:si.id, name:si.name, status:cols["status"]||"", voltage:cols["dropdown_mm65b542"]||"", manufacturer:cols["dropdown_mm65c7mt"]||"", deliveryDate:cols["date_mm65h7tw"]||"", parentId:si.parent_item?.id };
            });
          }

          const enrich = item => {
            const cv  = item.column_values;
            const ids = colVal(cv,"text_mm66tjan").split("|").filter(Boolean);
            const slotRaw      = colRaw(cv,"board_relation_mm5e11py");
            const slotId       = slotRaw?.linkedPulseIds?.[0]?.linkedPulseId || null;
            const reqRaw       = colRaw(cv,"peopleda149l5r");
            const requesterId  = reqRaw?.personsAndTeams?.[0]?.id || null;
            return {
              id: item.id, name: item.name,
              projectName:    colVal(cv,"text_mm5es7sz"),
              clientName:     colVal(cv,"short_texthrb2ladn"),
              requesterName:  colVal(cv,"peopleda149l5r"),
              requesterId,
              opportunityNum: colVal(cv,"short_textfukcenx9"),
              quantityNeeded: parseInt(colVal(cv,"numeric_mm5es9c9")||"0"),
              status:         colVal(cv,"status"),
              estimatedValue: colVal(cv,"number8jhwmqe9"),
              breakersEnable: colVal(cv,"single_selectjej2zay"),
              dropDeadDate:   colVal(cv,"date3z59ugdu"),
              capacityCheck:  colVal(cv,"formula_mm5s2fxb"),
              breakerIds: ids,
              breakers: ids.map(id=>subMap[id]||{ id, name:`Unit ${id}`, status:"Unknown" }),
              slotId,
            };
          };

          setRequests({ pending:pending.map(enrich), history:history.slice(0,8).map(enrich) });
        } catch(e) { setLoadErr("Failed to load requests: "+e.message); }
        finally { setLoading(false); }
      }, [apiKey]);

      const [syncing, setSyncing] = useState(false);
      const [syncMsg, setSyncMsg] = useState("");

      // Reconcile Reserved Qty on ALL 29 parent items from actual subitem statuses
      const syncAllCounts = async () => {
        setSyncing(true); setSyncMsg("");
        try {
          // Fetch all parent items with their subitems in one query
          const data = await gql(apiKey, `{
            boards(ids:[${SLOT_BOARD_ID}]) {
              items_page(limit:50) {
                items {
                  id name
                  subitems {
                    id
                    column_values(ids:["status"]) { id text }
                  }
                }
              }
            }
          }`);
          const items = data.boards[0].items_page.items;
          let updated = 0;
          for (const item of items) {
            const reservedCount = (item.subitems||[]).filter(si =>
              si.column_values?.find(c=>c.id==="status")?.text === "Reserved"
            ).length;
            await gql(apiKey,
              `mutation($itemId:ID!,$boardId:ID!,$cv:JSON!){ change_multiple_column_values(item_id:$itemId,board_id:$boardId,column_values:$cv){ id } }`,
              { itemId:String(item.id), boardId:String(SLOT_BOARD_ID), cv:JSON.stringify({ numeric_mm5sw1t1:reservedCount }) }
            );
            updated++;
          }
          // Also sync the Capacity Summary board by voltage class
          const voltages2 = ["145", "245", "362"];
          const allSubData = await gql(apiKey, `{ boards(ids:[${SUBITEMS_BOARD_ID}]) { items_page(limit:200) { items { column_values(ids:["status","dropdown_mm65b542"]) { id text } } } } }`);
          const allSubItems = allSubData.boards[0].items_page.items;
          for (const v of voltages2) {
            const forV = allSubItems.filter(si => si.column_values.find(c=>c.id==="dropdown_mm65b542")?.text === v);
            const avail2 = forV.filter(si => si.column_values.find(c=>c.id==="status")?.text === "Available").length;
            const resv2  = forV.filter(si => si.column_values.find(c=>c.id==="status")?.text === "Reserved").length;
            const sid = SUMMARY_ITEM[v];
            if (sid) await gql(apiKey, `mutation($itemId:ID!,$boardId:ID!,$cv:JSON!){ change_multiple_column_values(item_id:$itemId,board_id:$boardId,column_values:$cv){ id } }`,
              { itemId:String(sid), boardId:String(SUMMARY_BOARD_ID), cv:JSON.stringify({ [SUMMARY_COL.available]:avail2, [SUMMARY_COL.reserved]:resv2 }) });
          }
          setSyncMsg(`✓ Synced ${updated} PO lines and capacity summary — all counts reflect actual subitem statuses.`);
          setTimeout(()=>setSyncMsg(""), 6000);
        } catch(e) {
          setSyncMsg("Sync failed: "+e.message);
        } finally {
          setSyncing(false);
        }
      };

      const handleApprove = async req => {
        setActionState(p=>({...p,[req.id]:{working:true,error:null,done:false}}));
        const errs = [];
        try {
          // 1. Update each subitem
          for (const breakerId of req.breakerIds) {
            const bid = parseInt(breakerId);
            if (!bid) continue;
            try {
              const cv = { status:{ label:"Reserved" }, text_mm65z5wm:req.opportunityNum };
              if (req.requesterId) cv.person = { personsAndTeams:[{ id:parseInt(req.requesterId), kind:"person" }] };
              await gql(apiKey, `mutation($itemId:ID!,$boardId:ID!,$cv:JSON!){ change_multiple_column_values(item_id:$itemId,board_id:$boardId,column_values:$cv){ id } }`,
                { itemId:String(bid), boardId:String(SUBITEMS_BOARD_ID), cv:JSON.stringify(cv) });
            } catch(e) { errs.push(`Unit ${breakerId}: ${e.message}`); }
          }

          // 2. Recount subitems to get exact Reserved Qty (reliable even if statuses were changed manually)
          if (req.slotId) {
            try {
              const siData = await gql(apiKey, `{ items(ids:[${req.slotId}]) { subitems { id column_values(ids:["status"]) { id text } } } }`);
              const allSubs = siData.items?.[0]?.subitems || [];
              const reservedCount = allSubs.filter(si => si.column_values?.find(c=>c.id==="status")?.text === "Reserved").length;
              await gql(apiKey, `mutation($itemId:ID!,$boardId:ID!,$cv:JSON!){ change_multiple_column_values(item_id:$itemId,board_id:$boardId,column_values:$cv){ id } }`,
                { itemId:String(req.slotId), boardId:String(SLOT_BOARD_ID), cv:JSON.stringify({ numeric_mm5sw1t1:reservedCount }) });
            } catch(e) { errs.push("Reserved Qty sync: "+e.message); }
          }

          // 3. Update Capacity Summary board per voltage class
          try {
            // Recount subitems by voltage to update the summary board
            const voltages = ["145", "245", "362"];
            for (const v of voltages) {
              const itemId = SUMMARY_ITEM[v];
              if (!itemId) continue;
              // Count available and reserved subitems for this voltage
              const vData = await gql(apiKey, `{ boards(ids:[${SUBITEMS_BOARD_ID}]) { items_page(limit:200) { items { column_values(ids:["status","dropdown_mm65b542"]) { id text } } } } }`);
              const vItems = vData.boards[0].items_page.items;
              const forVoltage = vItems.filter(si => si.column_values.find(c=>c.id==="dropdown_mm65b542")?.text === v);
              const avail = forVoltage.filter(si => si.column_values.find(c=>c.id==="status")?.text === "Available").length;
              const resv  = forVoltage.filter(si => si.column_values.find(c=>c.id==="status")?.text === "Reserved").length;
              await gql(apiKey, `mutation($itemId:ID!,$boardId:ID!,$cv:JSON!){ change_multiple_column_values(item_id:$itemId,board_id:$boardId,column_values:$cv){ id } }`,
                { itemId:String(itemId), boardId:String(SUMMARY_BOARD_ID), cv:JSON.stringify({ [SUMMARY_COL.available]:avail, [SUMMARY_COL.reserved]:resv }) });
            }
          } catch(e) { errs.push("Summary board sync: "+e.message); }

          // 4. Set Project Request → Done
          await gql(apiKey, `mutation($itemId:ID!,$boardId:ID!,$cv:JSON!){ change_multiple_column_values(item_id:$itemId,board_id:$boardId,column_values:$cv){ id } }`,
            { itemId:String(req.id), boardId:String(REQUESTS_BOARD_ID), cv:JSON.stringify({ status:{ label:"Done" } }) });

          setActionState(p=>({...p,[req.id]:{ working:false, error:errs.length?errs.join("; "):null, done:true, outcome:"approved" }}));
          setTimeout(()=>loadRequests(), 1800);
        } catch(e) {
          setActionState(p=>({...p,[req.id]:{ working:false, error:"Approval failed: "+e.message, done:false }}));
        }
      };

      const handleDeny = async (req, reason) => {
        setDenyTarget(null); setDenyReason("");
        setActionState(p=>({...p,[req.id]:{working:true,error:null,done:false}}));
        try {
          await gql(apiKey, `mutation($itemId:ID!,$boardId:ID!,$cv:JSON!){ change_multiple_column_values(item_id:$itemId,board_id:$boardId,column_values:$cv){ id } }`,
            { itemId:String(req.id), boardId:String(REQUESTS_BOARD_ID), cv:JSON.stringify({ status:{ label:"Stuck" } }) });
          if (reason.trim()) {
            await gql(apiKey, `mutation($itemId:ID!,$body:String!){ create_update(item_id:$itemId,body:$body){ id } }`,
              { itemId:parseInt(req.id), body:`❌ Request denied.\n\nReason: ${reason}` });
          }
          setActionState(p=>({...p,[req.id]:{ working:false, error:null, done:true, outcome:"denied" }}));
          setTimeout(()=>loadRequests(), 1800);
        } catch(e) {
          setActionState(p=>({...p,[req.id]:{ working:false, error:"Denial failed: "+e.message, done:false }}));
        }
      };

      // ── SETUP ──────────────────────────────────────────────────────────────
      if (screen === "setup") return (
        <div style={{ minHeight:"100vh", background:C.light, display:"flex", alignItems:"center", justifyContent:"center", padding:24 }}>
          <div style={{ background:"#fff", borderRadius:12, boxShadow:"0 4px 24px rgba(0,0,0,0.10)", padding:40, maxWidth:460, width:"100%" }}>
            <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:20 }}>
              <div style={{ width:42, height:42, background:C.primary, borderRadius:10, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
                <svg width="22" height="22" fill="none" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
              </div>
              <div>
                <div style={{ fontSize:18, fontWeight:700, color:C.primary }}>BSF Review Dashboard</div>
                <div style={{ fontSize:12, color:"#64748b" }}>Burns & McDonnell — Breaker Slot Program</div>
              </div>
            </div>
            <div style={{ height:1, background:C.border, marginBottom:20 }}/>
            <p style={{ color:"#475569", fontSize:13, marginBottom:22, lineHeight:1.6 }}>Reviewer-only tool. Approving a request automatically marks all selected breaker units as Reserved in Monday.com, updates the slot's Reserved Qty, and writes the opportunity number to each unit.</p>
            <label style={lbl}>Monday.com API Key <span style={{ color:C.danger }}>*</span></label>
            <input type="password" value={apiKey} onChange={e=>setApiKey(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleSetup()} placeholder="eyJhbGciOiJIUzI1Ni..." style={{ ...inp, marginBottom:4 }}/>
            <div style={{ fontSize:11, color:"#94a3b8", marginBottom:22 }}>Profile → Developers → My Access Tokens</div>
            {setupErr && <div style={eb}>{setupErr}</div>}
            <button onClick={handleSetup} disabled={setupLoad} style={{ ...btp(C.primary,setupLoad), width:"100%" }}>{setupLoad?"Connecting…":"Open Review Dashboard →"}</button>
          </div>
        </div>
      );

      // ── DASHBOARD ─────────────────────────────────────────────────────────
      const { pending=[], history=[] } = requests;

      return (
        <div style={{ minHeight:"100vh", background:C.light, paddingBottom:40 }}>

          {/* Header */}
          <div style={{ background:C.primary, padding:"18px 28px", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
            <div style={{ display:"flex", alignItems:"center", gap:14 }}>
              <div style={{ width:40, height:40, background:"rgba(255,255,255,0.15)", borderRadius:8, display:"flex", alignItems:"center", justifyContent:"center" }}>
                <svg width="20" height="20" fill="none" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
              </div>
              <div>
                <div style={{ color:"#fff", fontSize:18, fontWeight:700 }}>BSF Review Dashboard</div>
                <div style={{ color:"rgba(255,255,255,0.65)", fontSize:12 }}>Breaker Slot Program · PO 280865</div>
              </div>
            </div>
            <div style={{ display:"flex", gap:8 }}>
              <button onClick={()=>syncAllCounts()} disabled={syncing||loading} style={{ ...bto, fontSize:12, background:syncing?"#f0fdf4":"#f1f5f9", color:syncing?C.green:"#334155" }}>{syncing?"Syncing counts…":"⟳ Sync Counts"}</button>
              <button onClick={()=>loadRequests()} style={{ ...bto, fontSize:12 }}>{loading?"Loading…":"↻ Refresh"}</button>
            </div>
          </div>

          <div style={{ maxWidth:820, margin:"28px auto", padding:"0 16px" }}>
            {syncMsg && (
            <div style={{ background:syncMsg.startsWith("✓")?"#f0fdf4":"#fef2f2", border:`1px solid ${syncMsg.startsWith("✓")?"#86efac":"#fecaca"}`, color:syncMsg.startsWith("✓")?C.green:C.danger, borderRadius:8, padding:"10px 16px", marginBottom:16, fontSize:13, fontWeight:500 }}>
              {syncMsg}
            </div>
          )}
          {loadErr && <div style={eb}>{loadErr}</div>}

            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:20 }}>
              <div style={{ fontSize:15, fontWeight:700, color:"#1e293b" }}>
                Pending Review
                <span style={{ marginLeft:10, background:"#fef3c7", color:"#92400e", fontSize:12, fontWeight:700, padding:"2px 9px", borderRadius:99 }}>{loading?"…":pending.length}</span>
              </div>
              {!loading && pending.length===0 && <div style={{ fontSize:13, color:"#64748b" }}>All caught up — no pending requests.</div>}
            </div>

            {/* Pending cards */}
            {pending.map(req => {
              const as = actionState[req.id]||{};
              return (
                <div key={req.id} style={{ ...crd, borderLeft:`4px solid ${as.done?(as.outcome==="approved"?C.green:C.danger):C.warn}` }}>

                  <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", gap:12, marginBottom:16 }}>
                    <div>
                      <div style={{ fontSize:16, fontWeight:700, color:C.primary }}>{req.opportunityNum||req.name}</div>
                      <div style={{ fontSize:14, color:"#475569", marginTop:2 }}>{req.projectName} — <span style={{ color:"#64748b" }}>{req.clientName}</span></div>
                    </div>
                    <div style={{ display:"flex", gap:8, flexShrink:0, flexWrap:"wrap", justifyContent:"flex-end" }}>
                      <span style={pill(C.warn,"#fef3c7")}>Pending Review</span>
                      {req.capacityCheck && <span style={pill(req.capacityCheck==="Sufficient"?C.green:C.danger,req.capacityCheck==="Sufficient"?"#dcfce7":"#fef2f2")}>{req.capacityCheck}</span>}
                    </div>
                  </div>

                  {/* Details grid */}
                  <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:"8px 16px", marginBottom:16, padding:"14px 16px", background:C.light, borderRadius:8, fontSize:13 }}>
                    {[
                      ["Requester",       req.requesterName||"—"],
                      ["Est. Value",      req.estimatedValue?`$${Number(req.estimatedValue).toLocaleString()}`:"—"],
                      ["Breakers Enable", req.breakersEnable||"—"],
                      ["Drop-Dead Date",  req.dropDeadDate||"—"],
                      ["Qty Requested",   req.quantityNeeded],
                      ["Units Selected",  `${req.breakerIds.length} unit${req.breakerIds.length!==1?"s":""}`],
                    ].map(([k,v])=>(
                      <div key={k}>
                        <div style={{ fontSize:10, fontWeight:700, color:"#94a3b8", letterSpacing:"0.05em", marginBottom:2 }}>{k.toUpperCase()}</div>
                        <div style={{ fontWeight:500, color:"#1e293b" }}>{v}</div>
                      </div>
                    ))}
                  </div>

                  {/* Breaker units */}
                  <div style={{ marginBottom:16 }}>
                    <div style={{ fontSize:11, fontWeight:700, color:"#94a3b8", letterSpacing:"0.05em", marginBottom:8 }}>REQUESTED BREAKER UNITS</div>
                    <div style={{ border:`1px solid ${C.border}`, borderRadius:8, overflow:"hidden" }}>
                      {req.breakers.length===0?(
                        <div style={{ padding:"12px 14px", fontSize:13, color:"#94a3b8" }}>No breaker details available</div>
                      ):req.breakers.map((b,i)=>(
                        <div key={b.id} style={{ display:"flex", alignItems:"center", gap:12, padding:"10px 14px", borderBottom:i<req.breakers.length-1?`1px solid ${C.border}`:"none", background:"#fff" }}>
                          <div style={{ flex:1 }}>
                            <div style={{ fontWeight:600, color:"#1e293b", fontSize:13 }}>{b.name}</div>
                            <div style={{ fontSize:11, color:"#64748b" }}>{[b.voltage&&`${b.voltage}kV`,b.manufacturer,b.deliveryDate&&`Delivery: ${b.deliveryDate}`].filter(Boolean).join(" · ")}</div>
                          </div>
                          <span style={pill(b.status==="Available"?C.green:b.status==="Reserved"?C.danger:"#64748b",b.status==="Available"?"#dcfce7":b.status==="Reserved"?"#fef2f2":"#f1f5f9")}>{b.status||"Unknown"}</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Actions */}
                  {as.done ? (
                    <div style={{ padding:"12px 16px", borderRadius:8, background:as.outcome==="approved"?"#f0fdf4":"#fef2f2", border:`1px solid ${as.outcome==="approved"?"#86efac":"#fecaca"}`, fontSize:13, fontWeight:600, color:as.outcome==="approved"?C.green:C.danger }}>
                      {as.outcome==="approved"?"✓ Approved — breakers marked Reserved, slot qty updated, opportunity number written to each unit":"✗ Denied — request closed"}
                      {as.error && <div style={{ fontWeight:400, marginTop:4, fontSize:12, color:C.warn }}>⚠ Completed with warnings: {as.error}</div>}
                    </div>
                  ):(
                    <>
                      {as.error && <div style={{ ...eb, marginBottom:12 }}>{as.error}</div>}
                      <div style={{ display:"flex", gap:10, flexWrap:"wrap", alignItems:"center" }}>
                        <button onClick={()=>handleApprove(req)} disabled={!!as.working} style={btp(C.green,!!as.working)}>{as.working?"Processing…":"✅ Approve"}</button>
                        <button onClick={()=>{setDenyTarget(req);setDenyReason("");}} disabled={!!as.working} style={btp(C.danger,!!as.working)}>❌ Deny</button>
                        <a href={`https://burnsmcd-inc.monday.com/boards/${REQUESTS_BOARD_ID}`} target="_blank" rel="noreferrer" style={{ fontSize:12, color:C.primary, textDecoration:"underline", marginLeft:"auto" }}>View in Monday.com →</a>
                      </div>
                    </>
                  )}
                </div>
              );
            })}

            {/* Recent history */}
            {history.length > 0 && (
              <div style={{ marginTop:32 }}>
                <div style={{ fontSize:14, fontWeight:700, color:"#64748b", marginBottom:14 }}>Recent Decisions</div>
                {history.map(req=>(
                  <div key={req.id} style={{ ...crd, borderLeft:`4px solid ${req.status==="Done"?C.green:C.danger}`, opacity:0.8 }}>
                    <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:12 }}>
                      <div>
                        <div style={{ fontSize:14, fontWeight:600, color:"#334155" }}>{req.opportunityNum||req.name}</div>
                        <div style={{ fontSize:12, color:"#64748b" }}>{req.projectName} — {req.clientName}</div>
                      </div>
                      <span style={pill(req.status==="Done"?C.green:C.danger,req.status==="Done"?"#dcfce7":"#fef2f2")}>{req.status==="Done"?"Approved":"Denied"}</span>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {loading && <div style={{ textAlign:"center", padding:40, color:"#64748b", fontSize:14 }}>Loading requests…</div>}
          </div>

          {/* Deny modal */}
          {denyTarget && (
            <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.45)", display:"flex", alignItems:"center", justifyContent:"center", padding:24, zIndex:1000 }}>
              <div style={{ background:"#fff", borderRadius:12, padding:32, maxWidth:440, width:"100%", boxShadow:"0 20px 60px rgba(0,0,0,0.2)" }}>
                <div style={{ fontSize:17, fontWeight:700, color:C.primary, marginBottom:6 }}>Deny Request</div>
                <div style={{ fontSize:13, color:"#475569", marginBottom:20 }}>Denying <strong>{denyTarget.opportunityNum||denyTarget.name}</strong>. Add an optional reason — it will be posted as a comment on the Monday.com item so the requester can see it.</div>
                <label style={lbl}>Reason (optional)</label>
                <textarea value={denyReason} onChange={e=>setDenyReason(e.target.value)} placeholder="e.g. Insufficient project value to justify slot reservation at this stage." rows={3} style={{ ...inp, resize:"vertical", marginBottom:20 }}/>
                <div style={{ display:"flex", gap:10 }}>
                  <button onClick={()=>handleDeny(denyTarget,denyReason)} style={{ ...btp(C.danger,false), flex:1 }}>Confirm Denial</button>
                  <button onClick={()=>{setDenyTarget(null);setDenyReason("");}} style={{ ...bto, flex:1 }}>Cancel</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App/>);
  </script>
</body>
</html>
