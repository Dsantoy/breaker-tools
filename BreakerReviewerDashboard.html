<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BSF Review Dashboard — Burns &amp; McDonnell</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Report generation: Word (docx) + PDF (pdf-lib) are built in the browser -->
  <script src="https://unpkg.com/docx@9.7.1/dist/index.iife.js"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #E2E8F0; font-family: system-ui, -apple-system, sans-serif; }
    select, input, textarea, button { font-family: inherit; }

    /* Header */
    .bmcd-header { background: #002D59; position: relative; overflow: hidden; padding: 20px 36px; display: flex; align-items: center; justify-content: space-between; }
    .bmcd-header::before { content:''; position:absolute; top:0;left:0;right:0;bottom:0;
      background-image: repeating-linear-gradient(-55deg,transparent,transparent 18px,rgba(0,73,205,0.3) 18px,rgba(0,73,205,0.3) 22px);
      pointer-events:none; }
    .bmcd-header-left { position:relative; z-index:1; display:flex; align-items:center; gap:14px; }
    .bmcd-header-right { position:relative; z-index:1; display:flex; gap:10px; }
    .bmcd-logo-wrap { background:rgba(255,255,255,.1); border-radius:10px; width:42px; height:42px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .bmcd-title { color:#fff; font-size:18px; font-weight:800; letter-spacing:.02em; }
    .bmcd-title-sub { color:rgba(255,255,255,.55); font-size:11px; margin-top:2px; letter-spacing:.04em; }
    .btn-header-outline { background:rgba(255,255,255,.1); color:#fff; border:1.5px solid rgba(255,255,255,.25); border-radius:7px; padding:8px 16px; font-size:12px; font-weight:600; cursor:pointer; }
    .btn-header-outline:disabled { opacity:.5; cursor:wait; }
    .btn-header-neon { background:#E6F001; color:#002D59; border:none; border-radius:7px; padding:8px 16px; font-size:12px; font-weight:800; cursor:pointer; }
    .btn-header-neon:disabled { opacity:.5; cursor:wait; }

    /* Stats bar */
    .stats-bar { background:#0049CD; padding:0 36px; display:flex; }
    .stat-item { padding:13px 32px 13px 0; border-right:1px solid rgba(255,255,255,.15); margin-right:32px; }
    .stat-item:last-child { border-right:none; }
    .stat-num { font-size:22px; font-weight:800; color:#E6F001; line-height:1; }
    .stat-lbl { font-size:9px; font-weight:700; color:rgba(255,255,255,.6); letter-spacing:.1em; text-transform:uppercase; margin-top:3px; }

    /* Main */
    .bmcd-main { padding:24px 36px; max-width:880px; margin:0 auto; }
    .section-row { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
    .section-title { font-size:14px; font-weight:700; color:#002D59; }
    .count-pill { font-size:11px; font-weight:700; padding:2px 9px; border-radius:99px; }
    .count-pill.amber { background:#FEF3C7; color:#92400E; }
    .count-pill.green { background:#DCFCE7; color:#166534; }
    .count-pill.gray  { background:#F1F5F9; color:#64748B; }

    /* Request cards */
    .req-card { background:#fff; border-radius:12px; border:1px solid #D4DCE6; box-shadow:0 2px 14px rgba(0,45,89,.07); margin-bottom:16px; overflow:hidden; }
    .req-card-top { padding:18px 22px; border-bottom:1px solid #EEF2F7; display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
    .req-opp { font-size:16px; font-weight:800; color:#002D59; }
    .req-proj { font-size:13px; color:#4D6680; margin-top:3px; }
    .req-client { color:#94A3B8; }
    .pill { font-size:10px; font-weight:700; padding:3px 10px; border-radius:99px; white-space:nowrap; flex-shrink:0; display:inline-flex; align-items:center; }
    .pill-pending  { background:#FEF3C7; color:#92400E; }
    .pill-approved { background:#DCFCE7; color:#166534; }
    .pill-denied   { background:#FEE2E2; color:#991B1B; }
    .pill-cap-ok   { background:#EEF3FC; color:#0049CD; }
    .pill-cap-warn { background:#FEF2F2; color:#991B1B; }

    /* Meta grid */
    .meta-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px 16px; padding:14px 22px; background:#F8FAFC; border-bottom:1px solid #EEF2F7; }
    .meta-lbl { font-size:9px; font-weight:700; color:#94A3B8; letter-spacing:.1em; text-transform:uppercase; margin-bottom:3px; }
    .meta-val { font-size:12px; font-weight:600; color:#002D59; }

    /* Breaker list */
    .breaker-section { padding:14px 22px; border-bottom:1px solid #EEF2F7; }
    .breaker-lbl { font-size:9px; font-weight:700; color:#94A3B8; letter-spacing:.1em; text-transform:uppercase; margin-bottom:8px; }
    .breaker-row { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:7px; margin-bottom:4px; }
    .breaker-row.avail { background:#F0FDF4; border:1px solid #BBF7D0; }
    .breaker-row.reserved-state { background:#FEF2F2; border:1px solid #FECACA; }
    .breaker-row.unknown { background:#F8FAFC; border:1px solid #D4DCE6; }
    .breaker-name { font-size:12px; font-weight:600; color:#002D59; flex:1; }
    .breaker-meta-text { font-size:11px; color:#94A3B8; margin-top:1px; }
    .b-pill { font-size:10px; font-weight:700; padding:2px 8px; border-radius:99px; flex-shrink:0; }
    .b-pill.g { background:#DCFCE7; color:#166534; }
    .b-pill.r { background:#FEE2E2; color:#991B1B; }
    .b-pill.u { background:#F1F5F9; color:#64748B; }

    /* Actions */
    .action-bar { padding:14px 22px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .btn-approve { background:#1A9B5A; color:#fff; border:none; border-radius:7px; padding:10px 22px; font-size:13px; font-weight:700; cursor:pointer; }
    .btn-approve:disabled { background:#94A3B8; cursor:not-allowed; }
    .btn-deny { background:#DC2626; color:#fff; border:none; border-radius:7px; padding:10px 22px; font-size:13px; font-weight:700; cursor:pointer; }
    .btn-deny:disabled { background:#94A3B8; cursor:not-allowed; }
    .btn-view-link { background:none; color:#0049CD; border:none; font-size:12px; font-weight:600; cursor:pointer; text-decoration:underline; margin-left:auto; }

    /* Result banners */
    .approved-banner { padding:14px 22px; background:#F0FDF4; border-top:3px solid #1A9B5A; display:flex; align-items:center; gap:12px; }
    .denied-banner   { padding:14px 22px; background:#FEF2F2; border-top:3px solid #DC2626; display:flex; align-items:center; gap:12px; }
    .banner-icon { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .banner-title { font-size:12px; font-weight:700; }
    .banner-title.g { color:#166534; }
    .banner-title.r { color:#991B1B; }
    .banner-sub { font-size:11px; color:#64748B; margin-top:2px; }
    .banner-warn { font-size:11px; color:#D97706; margin-top:4px; }

    /* Error box */
    .err-box { background:#FEF2F2; border:1px solid #FECACA; color:#DC2626; border-radius:8px; padding:10px 14px; font-size:12px; margin-bottom:10px; }

    /* Sync message */
    .sync-msg { border-radius:8px; padding:10px 16px; margin-bottom:14px; font-size:12px; font-weight:600; }
    .sync-msg.ok   { background:#F0FDF4; border:1px solid #86EFAC; color:#166534; }
    .sync-msg.fail { background:#FEF2F2; border:1px solid #FECACA; color:#DC2626; }

    /* History cards */
    .hist-card { background:#fff; border-radius:10px; border:1px solid #D4DCE6; padding:13px 18px; margin-bottom:8px; display:flex; align-items:center; justify-content:space-between; opacity:.88; }
    .hist-opp  { font-size:13px; font-weight:700; color:#002D59; }
    .hist-meta { font-size:11px; color:#94A3B8; margin-top:2px; }

    /* Setup */
    .setup-wrap { min-height:100vh; background:#E2E8F0; display:flex; align-items:center; justify-content:center; padding:24px; }
    .setup-box { background:#fff; border-radius:14px; box-shadow:0 4px 28px rgba(0,45,89,.12); padding:40px; max-width:470px; width:100%; }
    .setup-logo-row { display:flex; align-items:center; gap:13px; margin-bottom:6px; }
    .setup-divider { height:1px; background:#E8EDF4; margin:18px 0 22px; }
    .setup-inp { width:100%; padding:10px 13px; border:1.5px solid #D4DCE6; border-radius:7px; font-size:14px; color:#002D59; outline:none; background:#F8FAFB; margin-bottom:0; }
    .setup-inp:focus { border-color:#0049CD; background:#fff; box-shadow:0 0 0 3px rgba(0,73,205,.1); }
    .setup-hint { font-size:11px; color:#94A3B8; margin:4px 0 18px; }
    .setup-btn { background:#0049CD; color:#fff; border:none; border-radius:8px; padding:13px 24px; font-size:14px; font-weight:700; cursor:pointer; width:100%; }
    .setup-btn:disabled { opacity:.6; cursor:wait; }
    .bmcd-lbl { display:block; font-size:10px; font-weight:700; color:#4D6680; letter-spacing:.07em; text-transform:uppercase; margin-bottom:5px; }

    /* Deny modal */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; padding:24px; z-index:1000; }
    .modal-box { background:#fff; border-radius:14px; padding:32px; max-width:440px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.2); }
    .modal-title { font-size:17px; font-weight:800; color:#002D59; margin-bottom:6px; }
    .modal-body { font-size:13px; color:#4D6680; margin-bottom:20px; line-height:1.5; }
    .modal-textarea { width:100%; padding:10px 13px; border:1.5px solid #D4DCE6; border-radius:7px; font-size:13px; color:#002D59; outline:none; background:#F8FAFB; resize:vertical; margin-bottom:20px; }
    .modal-textarea:focus { border-color:#DC2626; background:#fff; }
    .modal-actions { display:flex; gap:10px; }
    .modal-confirm { background:#DC2626; color:#fff; border:none; border-radius:7px; padding:11px 22px; font-size:13px; font-weight:700; cursor:pointer; flex:1; }
    .modal-cancel { background:#F0F4F8; color:#334155; border:1.5px solid #D4DCE6; border-radius:7px; padding:11px 22px; font-size:13px; font-weight:600; cursor:pointer; flex:1; }

    /* Footer */
    .bmcd-footer { text-align:center; padding:16px 0 28px; font-size:10px; color:#94A3B8; letter-spacing:.07em; }

    /* Loading */
    .loading-state { text-align:center; padding:48px 0; color:#94A3B8; font-size:13px; }
    .empty-state { text-align:center; padding:32px 0; color:#94A3B8; font-size:13px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
/* ===================================================================
 * BSFReport — builds the Executive Summary (.docx) and Board Summary (.pdf)
 * from live Monday.com data returned by the Worker's /reviewer-report-data.
 *
 *   BSFReport.compute(raw, opts)        -> model (all numbers + narrative text)
 *   BSFReport.buildDocx(model, docx)    -> Promise<Blob>   (docx = window.docx)
 *   BSFReport.buildPdf(model, PDFLib)   -> Promise<Uint8Array>
 *   BSFReport.download(blobOrBytes, filename, mime)
 *
 * Everything shown in the reports is calculated here from Monday data.
 * The only hand-maintained inputs are in REPORT_CONFIG below.
 * =================================================================== */
(function (root) {
  "use strict";

  /* ------------------------------------------------------------------
   * REPORT_CONFIG — values that do NOT exist in Monday.com.
   * Edit these when they change; everything else is live.
   * ------------------------------------------------------------------ */
  var REPORT_CONFIG = {
    // Date of the previous report. "Commitments rose from X to Y since the
    // <date> report" compares live data against requests created on/before it.
    baselineDate: "2026-10-16",

    // Assumed net margins for the illustrative net-income scenarios.
    margins: [
      { label: "Low", pct: 5 },
      { label: "Base", pct: 8 },
      { label: "High", pct: 12 },
    ],
    baseMarginIndex: 1,

    // Initial-drawing due dates to BMcD come from the Master Tracker workbook,
    // not Monday. Add/adjust entries here (PO line numbers + date).
    drawings: [
      { mfr: "Hitachi", label: "Hitachi initial drawings", lines: range(18, 29), date: "2026-11-09" },
      { mfr: "GE", label: "GE initial drawings", lines: [1], date: "2027-03-29" },
    ],

    // Optional free-text paragraph shown under the overview (leave "" to omit).
    programNote:
      "Now that the program is in flight, BMcD is working with Wesco to request additional flexibility from GE and Hitachi to enable even more projects. Examples include pulling 4 slots forward.",

    // No Monday columns for these two Program Snapshot rows.
    manufacturingStatusSuffix: "Booked (none yet in production)",
    unitsOnHold: 0,

    // Days thresholds for deadline shading / alerts.
    redDays: 30,
    amberDays: 90,
    soonDays: 14,
  };

  function range(a, b) { var r = []; for (var i = a; i <= b; i++) r.push(i); return r; }

  /* ------------------------------------------------------------------
   * Small helpers
   * ------------------------------------------------------------------ */
  var MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var WEEKDAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

  function dn(s) { // 'YYYY-MM-DD' -> day number (UTC days)
    if (!s) return null;
    var p = String(s).slice(0, 10).split("-").map(Number);
    if (p.length < 3 || isNaN(p[0])) return null;
    return Math.round(Date.UTC(p[0], p[1] - 1, p[2]) / 864e5);
  }
  function parts(n) { var d = new Date(n * 864e5); return { y: d.getUTCFullYear(), m: d.getUTCMonth(), d: d.getUTCDate(), wd: d.getUTCDay() }; }
  function fmtFull(n) { var p = parts(n); return MON[p.m] + " " + p.d + ", " + p.y; }               // Mar 5, 2027
  function fmtLongDate(n) { var p = parts(n); return MONTHS[p.m] + " " + p.d + ", " + p.y; }        // November 5, 2026
  function fmtMonthDay(n) { var p = parts(n); return MONTHS[p.m] + " " + p.d; }                    // October 16
  function fmtShort(n, todayN) { var p = parts(n), t = parts(todayN); return MON[p.m] + " " + p.d + (p.y === t.y ? "" : ", " + p.y); }
  function fmtM(v) {
    var m = Math.round((v / 1e6) * 10) / 10;
    return "$" + (m % 1 === 0 ? String(m) : m.toFixed(1)) + "M";
  }
  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
  function plural(n, one, many) { return n === 1 ? one : (many || one + "s"); }
  function andJoin(a) {
    if (a.length <= 1) return a.join("");
    if (a.length === 2) return a[0] + " and " + a[1];
    return a.slice(0, -1).join(", ") + ", and " + a[a.length - 1];
  }
  function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  function uniq(a) { return a.filter(function (x, i) { return a.indexOf(x) === i; }); }
  function sum(a, f) { return a.reduce(function (s, x) { return s + (f ? f(x) : x); }, 0); }
  function num(x) { var n = parseFloat(String(x || "").replace(/,/g, "")); return isNaN(n) ? 0 : n; }
  function shortProject(p) { return String(p || "").replace(/\s*\([^)]*\)\s*$/, "").trim(); }
  function shortClient(c) { return String(c || "").replace(/\s+(Company|Co\.?|Inc\.?|LLC|Corp\.?|Corporation)$/i, "").trim(); }
  function stamp(n) { var p = parts(n); return pad(p.m + 1) + "-" + pad(p.d) + "-" + String(p.y).slice(2); }
  function pad(x) { return (x < 10 ? "0" : "") + x; }
  function localToday() { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function relDay(days) { return days === 0 ? "today" : days === 1 ? "tomorrow" : "in " + days + " days"; }

  // [1,2,3,11,12,18,19] -> "1 to 3, 11, 12, 18, 19"  (runs of 3+ collapse)
  function compressLines(nums) {
    var a = uniq(nums.slice().sort(function (x, y) { return x - y; })), out = [], i = 0;
    while (i < a.length) {
      var j = i;
      while (j + 1 < a.length && a[j + 1] === a[j] + 1) j++;
      if (j - i >= 2) out.push(a[i] + " to " + a[j]);
      else for (var k = i; k <= j; k++) out.push(String(a[k]));
      i = j + 1;
    }
    return out.join(", ");
  }
  function linesLabel(nums) { return (nums.length === 1 ? "Line " : "Lines ") + compressLines(nums); }
  // "Lines 1 and 2" / "Lines 11, 12, and 18" (runs of 3+ collapse to "a to b")
  function linesPhrase(nums) {
    var u = uniq(nums.slice().sort(function (x, y) { return x - y; }));
    return (u.length === 1 ? "Line " : "Lines ") + andJoin(compressLines(u).split(", "));
  }

  /* ------------------------------------------------------------------
   * compute(): raw Monday data -> report model
   * ------------------------------------------------------------------ */
  function compute(raw, opts) {
    opts = opts || {};
    var cfg = {}; for (var k in REPORT_CONFIG) cfg[k] = REPORT_CONFIG[k];
    for (var k2 in opts) if (opts[k2] != null) cfg[k2] = opts[k2];
    var todayStr = opts.today || localToday();
    var T = dn(todayStr);
    var baseN = dn(cfg.baselineDate);

    /* ---- units & lines ---- */
    var slotById = {}, lines = {};
    (raw.slots || []).forEach(function (s) {
      slotById[s.id] = s;
      var n = parseInt(s.poLine, 10);
      s.poLineN = n;
      lines[n] = {
        n: n, mfr: s.mfr, voltage: s.voltage, qty: num(s.qty),
        feedbackDue: dn(s.feedbackDue), techDue: dn(s.techDue), name: s.name, units: [],
      };
    });
    var units = (raw.units || []).map(function (u) {
      var ln = parseInt(u.poLine, 10);
      if (isNaN(ln) && u.parentId && slotById[u.parentId]) ln = slotById[u.parentId].poLineN;
      return {
        id: String(u.id), name: u.name, status: u.status || "Available", voltage: u.voltage, mfr: u.mfr,
        opp: (u.opp || "").trim(), line: ln, techDue: dn(u.techDue),
      };
    });
    var unitById = {};
    units.forEach(function (u) {
      unitById[u.id] = u;
      if (!lines[u.line]) lines[u.line] = { n: u.line, mfr: u.mfr, voltage: u.voltage, qty: 0, units: [], techDue: u.techDue };
      lines[u.line].units.push(u);
    });
    Object.keys(lines).forEach(function (k) { var L = lines[k]; if (!L.qty) L.qty = L.units.length; });
    var lineArr = Object.keys(lines).map(function (k) { return lines[k]; }).sort(function (a, b) { return a.n - b.n; });

    var total = units.length;
    var cnt = { "Available": 0, "Pending Review": 0, "Pending Reservation": 0, "Reserved": 0 };
    units.forEach(function (u) { if (cnt[u.status] != null) cnt[u.status]++; });
    var committed = cnt["Pending Review"] + cnt["Pending Reservation"] + cnt["Reserved"];
    var mfrCount = {};
    units.forEach(function (u) { mfrCount[u.mfr] = (mfrCount[u.mfr] || 0) + 1; });
    var mfrText = Object.keys(mfrCount).sort(function (a, b) { return a === "GE" ? -1 : b === "GE" ? 1 : a < b ? -1 : 1; })
      .map(function (m) { return m + " " + mfrCount[m]; }).join(" | ");

    function isCommittedLine(L) { return L.units.some(function (u) { return u.status !== "Available"; }); }
    function isFullLine(L) { return L.units.length > 0 && L.units.every(function (u) { return u.status !== "Available"; }); }

    /* ---- requests ---- */
    var reqs = (raw.requests || []).map(function (r) {
      var cat = r.status === "Done" ? "approved" : r.status === "Working on it" ? "review" : r.status === "In Queue" ? "queued" : r.status === "Stuck" ? "denied" : "other";
      var slot = slotById[r.slotId];
      var rq = {
        id: r.id, opp: r.opp || r.name, project: r.project || "", client: r.client || "",
        qty: num(r.qty), value: num(r.value), dropDead: dn(r.dropDead), status: r.status, cat: cat,
        breakerIds: (r.breakerIds || []).map(String), line: slot ? slot.poLineN : null,
        created: dn(r.createdAt), updated: dn(r.updatedAt), reviewedBy: r.reviewedBy || "",
      };
      rq.units = rq.breakerIds.map(function (id) { return unitById[id]; }).filter(Boolean);
      rq.customer = shortClient(rq.client);
      rq.proj = shortProject(rq.project);
      return rq;
    });
    var approved = reqs.filter(function (r) { return r.cat === "approved"; });
    var review = reqs.filter(function (r) { return r.cat === "review"; });
    var queued = reqs.filter(function (r) { return r.cat === "queued"; });
    var active = approved.concat(review);

    var awaiting = approved.filter(function (r) { return r.units.some(function (u) { return u.status !== "Reserved"; }) || r.units.length === 0; });
    var approvedQty = sum(approved, function (r) { return r.qty; });
    var approvedVal = sum(approved, function (r) { return r.value; });
    var reviewQty = sum(review, function (r) { return r.qty; });
    var reviewVal = sum(review, function (r) { return r.value; });
    var awaitingQty = sum(awaiting, function (r) { return r.qty; });
    var awaitingVal = sum(awaiting, function (r) { return r.value; });
    var totalVal = approvedVal + reviewVal;

    // baseline: requests that already existed at the previous report
    var baseReqs = baseN == null ? [] : active.filter(function (r) { return r.created != null && r.created <= baseN; });
    var baseline = {
      date: baseN, committed: sum(baseReqs, function (r) { return r.qty; }), requests: baseReqs.length,
    };

    /* ---- voltage classes ---- */
    var classes = uniq(lineArr.map(function (L) { return String(L.voltage); })).sort(function (a, b) { return a - b; }).map(function (v) {
      var ls = lineArr.filter(function (L) { return String(L.voltage) === v; });
      var us = [].concat.apply([], ls.map(function (L) { return L.units; }));

    });
    var fullLinesAll = lineArr.filter(isFullLine).map(function (L) { return L.n; });

    /* ---- data-quality issues ---- */
    var issues = [];

    Object.keys(pairs).forEach(function (k) {

    }
    var narrIssues = mergedIssues(issues);

    /* ---- PO status ---- */
    function poOpen(r) { return r.units.length === 0 || r.units.some(function (u) { return u.status !== "Reserved"; }); }
    var pastDue = approved.filter(function (r) { return r.dropDead != null && r.dropDead < T && poOpen(r); }).sort(function (a, b) { return a.dropDead - b.dropDead; });
    var soon = approved.filter(function (r) { return r.dropDead != null && r.dropDead >= T && r.dropDead - T <= cfg.soonDays && poOpen(r); }).sort(function (a, b) { return a.dropDead - b.dropDead; });

    var drawings = cfg.drawings.map(function (d) {

    /* ---- capacity ---- */

    var lateUnits = units.filter(function (u) { return u.techDue != null && u.techDue < T && u.status !== "Reserved" && u.status !== "Available"; }).length;
    var onTrackUnits = total - lateUnits;

    var demandUp = committed > baseline.committed && baseline.committed > 0 && committed >= baseline.committed * 1.25;
    var poPressure = pastDue.length > 0 || soon.length > 0;
    var headBits = [];

    /* ---- first-to-convert projects ---- */
    var firstPO = awaiting.filter(function (r) { return r.dropDead != null; }).sort(function (a, b) { return a.dropDead - b.dropDead; }).slice(0, 2);
    var firstPOText = firstPO.length ? ", starting with " + andJoin(firstPO.map(function (r) { return r.proj; })) : "";

    /* ---- overview paragraphs ---- */
    var custTotals = {};
    approved.forEach(function (r) { var c = r.customer || "Unknown"; custTotals[c] = custTotals[c] || { n: 0, qty: 0, val: 0 }; custTotals[c].n++; custTotals[c].qty += r.qty; custTotals[c].val += r.value; });
    var topCust = Object.keys(custTotals).sort(function (a, b) { return custTotals[b].val - custTotals[a].val; })[0];
    var growth = baseline.committed > 0 && (committed !== baseline.committed || active.length !== baseline.requests)
      ? " Since the " + fmtMonthDay(baseN) + " report, commitments have " + (committed >= baseline.committed ? "risen" : "fallen") + " from " + baseline.committed + " to " + committed + " breakers (" + pct(committed, total) + "% of the program) and active requests from " + baseline.requests + " to " + active.length + "."
      : "";
    var overview1 =

      "In total, " + approved.length + " approved " + plural(approved.length, "request") + " cover " + approvedQty + " breakers and " + fmtM(approvedVal) + " in estimated project value" +

      : "Commitments stand at " + committed + " breakers (" + pct(committed, total) + "% of the program) across " + active.length + " active " + plural(active.length, "request") + ".") +
      " Near-term focus is converting approved requests into customer POs" + firstPOText + ".";

    /* ---- snapshot ---- */
    var snapshot = [

    // 2 PO status

    }

    if (reviewSorted.length) {

        (rv.dropDead != null ? " has a PO drop-dead date of " + fmtShort(rv.dropDead, T) + (rv.dropDead >= T ? ", so a reviewer decision is needed well ahead of that date." : ", which has passed, so a reviewer decision is overdue.") : " needs a reviewer decision."));

    } else {

          dd.label + " (" + linesLabel(dd.lines) + ", " + dd.qty + " breakers) " + (dd.days <= 7 ? "are" : "are") + " due to BMcD on " + fmtMonthDay(dd.date) + (drawings[0] === dd ? ", the first drawing-review obligation in the program" : "") + ". BMcD review capacity should be confirmed" + (dd.days <= 14 ? " now" : " ahead of that date") + ".");

      }

      if (rv.length) acts.push("Approve or deny the request ahead of the PO date");
      var seen = {};
      lineIssues.forEach(function (i) { if (!seen[i.action] && acts.length < 3) { seen[i.action] = 1; acts.push(i.action); } });
      if (dr && dr.days <= 30 && dr.days >= -7) acts.push("confirm reviewer staffing");

      var actionText = acts.map(function (a, i) { return i === 0 ? cap(a) : a; }).join("; ");

      // shading: nearest PO drop-dead / feedback date

      var nearest = shadeDates.length ? Math.min.apply(null, shadeDates.map(function (d) { return d - T; })) : null;

      return {

    }).sort(function (a, b) { return (a.techDue == null ? 1e9 : a.techDue) - (b.techDue == null ? 1e9 : b.techDue); });

    /* ---- leadership actions ---- */
    var actions = [];
    if (pastDue.length || soon.length) {
      var bits = [];

    panel(46, 637, 548, 229, "Slot inventory by voltage class (breakers)");
    (function () {
      var cs = m.classes, maxT = Math.max.apply(null, cs.map(function (c) { return c.total; }).concat([1]));
      var x0 = 114, wMax = 248, y0 = 700, step = 44;
      var items = [["Available", C.grey], ["Pending Reservation", C.green], ["Pending Review", C.orange]];
      if (cs.some(function (c) { return c.res > 0; })) items.push(["Reserved", C.navy]);
      var lx = 118;
      items.forEach(function (it) { rect(lx, 683, 11, 8, it[1]); var w = text(it[0], lx + 16, 691, 10, {}); lx += 16 + w + 26; });
      cs.forEach(function (c, i) {
        var y = y0 + i * step;
        text(c.v + " kV", 60, y + 17, 12, { color: C.text });
        var x = x0;
        [[c.avail, C.grey], [c.pres, C.green], [c.pr, C.orange], [c.res, C.navy]].forEach(function (seg) {
          var w = wMax * seg[0] / maxT;
          if (w > 0) { rect(x, y, w, 24, seg[1]); x += w; }
        });
        text(String(c.total), x + 8, y + 17, 12, { font: FB, color: C.navy });
      });
    })();

    // panel 5: attention
    panel(616, 637, 548, 229, "Board attention items");
    (function () {
      var y = 695, maxLines = 11;
      m.attention.forEach(function (t) {
        var ls = wrap(t, 12.6, 487, F);
        if (y > 850) return;
        text("•", 632, y, 12.6, { color: C.text });
        ls.forEach(function (l, i) { if (y + i * 17 < 856) text(l, 646, y + i * 17, 12.6, { color: C.text }); });
        y += ls.length * 17 + 9;
      });
    })();

    // footnotes
    text("*Illustrative only: net income = assumed net margin (" + m.marginText.replace(/%/g, "%") + ") applied to estimated project value. Monday.com contains no net income data; replace with finance-approved margins.", 47, 884, 10, { font: FI, color: C.mute });
    var rn = m.reviewNames.length ? " " + m.fmtM(m.kpis.reviewVal) + " under review (" + m.reviewNames.join(", ") + ") is not yet approved." : "";
    text("Source: Monday.com Breaker Slot Program Workspace, pulled live " + m.generated.dateText + ". Project values are estimates." + rn, 47, 898, 10, { font: FI, color: C.mute });

    return pdf.save();
  }

  function download(data, filename, mime) {
    var blob = data instanceof Blob ? data : new Blob([data], { type: mime || "application/octet-stream" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 2000);
  }

  var api = { compute: compute, buildDocx: buildDocx, buildPdf: buildPdf, download: download, config: REPORT_CONFIG };
  if (typeof module !== "undefined" && module.exports) module.exports = api; else root.BSFReport = api;
})(typeof window !== "undefined" ? window : globalThis);

  </script>
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    // TODO: replace with your deployed Cloudflare Worker's URL — the SAME
    // Worker the Request Form uses — no trailing slash.
    const PROXY_BASE_URL   = "https://breaker-slot-proxy.dsantoy2014.workers.dev";
    const PROXY_SHARED_SECRET = "BurnsMcDonnell2026";

    const REQUESTS_BOARD_ID = 18422875681;
    const SUBITEMS_BOARD_ID = 18426331487;
    const SLOT_BOARD_ID     = 18422871700;

    function colVal(cvs, id) { return cvs?.find(c=>c.id===id)?.text || ""; }
    function colRaw(cvs, id) { const r=cvs?.find(c=>c.id===id)?.value; try{return r?JSON.parse(r):null;}catch{return null;} }

    async function proxyGet(path) {
      const res = await fetch(PROXY_BASE_URL + path, { headers:{ "X-Proxy-Secret": PROXY_SHARED_SECRET } });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }
    async function proxyPost(path, body) {
      const res = await fetch(PROXY_BASE_URL + path, {
        method:"POST",
        headers:{ "Content-Type":"application/json", "X-Proxy-Secret": PROXY_SHARED_SECRET },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    /* BMcD logo mark */
    const LogoMark = ({ size=28 }) => (
      <img src="https://raw.githubusercontent.com/Dsantoy/breaker-tools/main/ampersand-mark-white.svg" width={size} height={size} alt=""/>
    );

    function App() {
      const [reviewerEmail, setReviewerEmail] = useState("");
      const [loginInput,  setLoginInput]  = useState("");
      const [setupLoad,   setSetupLoad]   = useState(false);
      const [setupErr,    setSetupErr]    = useState("");
      const [screen,      setScreen]      = useState("setup");
      const [requests,    setRequests]    = useState({ pending:[], history:[] });
      const [loading,     setLoading]     = useState(false);
      const [loadErr,     setLoadErr]     = useState("");
      const [actionState, setActionState] = useState({});
      const [denyTarget,  setDenyTarget]  = useState(null);
      const [denyReason,  setDenyReason]  = useState("");
      const [syncing,     setSyncing]     = useState(false);
      const [syncMsg,     setSyncMsg]     = useState("");
      const [reporting,   setReporting]   = useState(false);
      const [reportMsg,   setReportMsg]   = useState(null);

      /* ── Login (allowlist check, no Monday credential involved) ── */
      const handleSetup = async () => {
        const email = loginInput.trim().toLowerCase();
        if (!email) { setSetupErr("Email is required."); return; }
        setSetupErr(""); setSetupLoad(true);
        try {
          const result = await proxyPost("/reviewer-login", { email });
          if (!result.authorized) {
            setSetupErr("This email is not on the BSF Review Committee list. Contact the program owner if this is a mistake.");
            return;
          }
          setReviewerEmail(email);
          setScreen("dashboard");
          loadRequests();
        } catch(e) { setSetupErr("Connection failed: "+e.message); }
        finally { setSetupLoad(false); }
      };

      /* ── Load requests ── */
      const loadRequests = useCallback(async () => {
        setLoading(true); setLoadErr("");
        try {
          const data = await proxyGet("/reviewer-read");
          setRequests(data);
        } catch(e) { setLoadErr("Failed to load requests: "+e.message); }
        finally { setLoading(false); }
      }, []);

      /* ── Sync counts ── */
      const syncAllCounts = async () => {
        setSyncing(true); setSyncMsg("");
        try {
          const result = await proxyPost("/reviewer-sync-counts", { reviewerEmail });
          setSyncMsg(result.success ? result.message : ("Sync failed: "+result.error));
          setTimeout(()=>setSyncMsg(""), 6000);
        } catch(e) { setSyncMsg("Sync failed: "+e.message); }
        finally { setSyncing(false); }
      };

      /* ── Generate reports: Executive Summary (.docx) + Board Summary (.pdf) ──
         One click: pulls fresh data from Monday through the Worker, then builds
         both files in the browser. Nothing is cached. */
      const generateReports = async () => {
        setReporting(true); setReportMsg(null);
        try {
          if (!window.docx || !window.PDFLib || !window.BSFReport)
            throw new Error("Report libraries did not load. Check your connection and refresh the page.");
          const raw = await proxyPost("/reviewer-report-data", { reviewerEmail });
          if (raw.error) throw new Error(raw.error);
          const model = window.BSFReport.compute(raw, { reviewerEmail });
          const [docBlob, pdfBytes] = await Promise.all([
            window.BSFReport.buildDocx(model, window.docx),
            window.BSFReport.buildPdf(model, window.PDFLib),
          ]);
          window.BSFReport.download(docBlob, model.files.docx);
          setTimeout(() => window.BSFReport.download(pdfBytes, model.files.pdf, "application/pdf"), 600);
          setReportMsg({ ok:true, text:`Generated ${model.files.docx} and ${model.files.pdf} from live Monday data.` });
          setTimeout(()=>setReportMsg(null), 9000);
        } catch(e) {
          setReportMsg({ ok:false, text:"Report generation failed: "+e.message });
        } finally { setReporting(false); }
      };

      /* ── Approve ── */
      const handleApprove = async req => {
        setActionState(p=>({...p,[req.id]:{working:true,error:null,done:false}}));
        try {
          const result = await proxyPost("/reviewer-approve", {
            reviewerEmail,
            requestId: req.id,
            breakerIds: req.breakerIds,
            opportunityNum: req.opportunityNum,
            requesterId: req.requesterId,
            slotId: req.slotId,
          });
          if (!result.success) throw new Error(result.error || "Approval failed.");
          setActionState(p=>({...p,[req.id]:{ working:false, error:result.errors?result.errors.join("; "):null, done:true, outcome:"approved" }}));
          setTimeout(()=>loadRequests(), 1800);
        } catch(e) {
          setActionState(p=>({...p,[req.id]:{ working:false, error:"Approval failed: "+e.message, done:false }}));
        }
      };

      /* ── Deny ── */
      const handleDeny = async (req, reason) => {
        setDenyTarget(null); setDenyReason("");
        setActionState(p=>({...p,[req.id]:{working:true,error:null,done:false}}));
        try {
          const result = await proxyPost("/reviewer-deny", { reviewerEmail, requestId: req.id, reason, breakerIds: req.breakerIds });
          if (!result.success) throw new Error(result.error || "Denial failed.");
          setActionState(p=>({...p,[req.id]:{ working:false, error:null, done:true, outcome:"denied" }}));
          setTimeout(()=>loadRequests(), 1800);
        } catch(e) {
          setActionState(p=>({...p,[req.id]:{ working:false, error:"Denial failed: "+e.message, done:false }}));
        }
      };

      /* ── Mark as Reserved (customer PO received) ── */
      const [markReservedState, setMarkReservedState] = useState({});

      const handleMarkReserved = async (req) => {
        setMarkReservedState(p=>({...p,[req.id]:{working:true,error:null,done:false}}));
        try {
          const result = await proxyPost("/reviewer-mark-reserved", {
            reviewerEmail,
            breakerIds: req.breakerIds,
            slotId: req.slotId,
          });
          if (!result.success) throw new Error(result.error || "Failed.");
          setMarkReservedState(p=>({...p,[req.id]:{ working:false, error:result.errors?result.errors.join("; "):null, done:true }}));
          setTimeout(()=>loadRequests(), 1800);
        } catch(e) {
          setMarkReservedState(p=>({...p,[req.id]:{ working:false, error:"Failed: "+e.message, done:false }}));
        }
      };

      /* ── SETUP / LOGIN SCREEN ── */
      if (screen==="setup") return (
        <div className="setup-wrap">
          <div className="setup-box">
            <div className="setup-logo-row">
              <div style={{ background:"#002D59", borderRadius:10, width:42, height:42, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
                <LogoMark/>
              </div>
              <div>
                <div style={{ fontSize:16, fontWeight:800, color:"#002D59", letterSpacing:".03em" }}>BURNS &amp; McDONNELL</div>
                <div style={{ fontSize:11, color:"#94A3B8", marginTop:2 }}>BSF Review Dashboard</div>
              </div>
            </div>
            <div className="setup-divider"/>
            <p style={{ color:"#4D6680", fontSize:13, marginBottom:22, lineHeight:1.6 }}>
              Reviewer-only tool, restricted to the BSF Review Committee. Approving a request automatically marks all selected breaker units as Reserved in Monday.com, updates the slot Reserved Qty, and writes the opportunity number to each unit.
            </p>
            <label className="bmcd-lbl">Your Email <span style={{ color:"#DC2626" }}>*</span></label>
            <input type="email" value={loginInput} onChange={e=>setLoginInput(e.target.value)}
              onKeyDown={e=>e.key==="Enter"&&handleSetup()}
              placeholder="you@burnsmcd.com" className="setup-inp"/>
            <div className="setup-hint">Restricted to BSF Review Committee members.</div>
            {setupErr && <div className="err-box">{setupErr}</div>}
            <button onClick={handleSetup} disabled={setupLoad} className="setup-btn">
              {setupLoad ? "Checking…" : "Open Review Dashboard →"}
            </button>
          </div>
        </div>
      );

      /* ── DASHBOARD ── */
      const { pending=[], queued=[], history=[] } = requests;

      return (
        <div style={{ minHeight:"100vh", background:"#E2E8F0", paddingBottom:40 }}>

          {/* Header */}
          <div className="bmcd-header">
            <div className="bmcd-header-left">
              <div className="bmcd-logo-wrap"><LogoMark/></div>
              <div>
                <div className="bmcd-title">BSF Review Dashboard</div>
                <div className="bmcd-title-sub">BURNS &amp; McDONNELL &nbsp;·&nbsp; HV CIRCUIT BREAKER SLOT PROGRAM &nbsp;·&nbsp; {reviewerEmail}</div>
              </div>
            </div>
            <div className="bmcd-header-right">
              <button onClick={generateReports} disabled={reporting||syncing} className="btn-header-outline"
                title="Download the Executive Summary (Word) and Board Summary (PDF) built from live Monday data">
                {reporting ? "Generating…" : "Generate Reports"}
              </button>
              <button onClick={syncAllCounts} disabled={syncing||loading} className="btn-header-outline">
                {syncing ? "Syncing…" : "Sync Counts"}
              </button>
              <button onClick={()=>loadRequests()} disabled={loading} className="btn-header-neon">
                {loading ? "Loading…" : "Refresh"}
              </button>
            </div>
          </div>

          {/* Stats bar */}
          <div className="stats-bar">
            <div className="stat-item">
              <div className="stat-num">{loading?"…":pending.length}</div>
              <div className="stat-lbl">Pending Review</div>
            </div>
            <div className="stat-item">
              <div className="stat-num">{loading?"…":queued.length}</div>
              <div className="stat-lbl">In Queue</div>
            </div>
            <div className="stat-item">
              <div className="stat-num">{loading?"…":history.length}</div>
              <div className="stat-lbl">Total Decisions</div>
            </div>
            <div className="stat-item">
              <div className="stat-num">120</div>
              <div className="stat-lbl">Total Program Units</div>
            </div>
          </div>

          {/* Main content */}
          <div className="bmcd-main">

            {syncMsg && (
              <div className={`sync-msg ${syncMsg.startsWith("Synced")?"ok":"fail"}`}>{syncMsg}</div>
            )}
            {reportMsg && (
              <div className={`sync-msg ${reportMsg.ok?"ok":"fail"}`}>{reportMsg.text}</div>
            )}
            {loadErr && <div className="err-box">{loadErr}</div>}

            {/* Pending section */}
            <div className="section-row">
              <div className="section-title">Pending Review</div>
              <span className="count-pill amber">{loading?"…":pending.length} request{pending.length!==1?"s":""}</span>
              {!loading && pending.length===0 && <span style={{ fontSize:12, color:"#94A3B8" }}>— All caught up</span>}
            </div>

            {loading && <div className="loading-state">Loading requests from Monday.com…</div>}

            {!loading && pending.length===0 && (
              <div className="empty-state">No pending requests at this time.</div>
            )}

            {pending.map(req => {
              const as = actionState[req.id]||{};
              const capOk = req.capacityCheck==="Sufficient";
              return (
                <div key={req.id} className="req-card"
                  style={{ borderLeft:`4px solid ${as.done?(as.outcome==="approved"?"#1A9B5A":"#DC2626"):"#E6A000"}` }}>

                  {/* Card top */}
                  <div className="req-card-top">
                    <div>
                      <div className="req-opp">{req.opportunityNum||req.name}</div>
                      <div className="req-proj">{req.projectName} &mdash; <span className="req-client">{req.clientName}</span></div>
                    </div>
                    <div style={{ display:"flex", gap:8, flexShrink:0, flexWrap:"wrap", justifyContent:"flex-end" }}>
                      <span className="pill pill-pending">Pending Review</span>
                      {req.capacityCheck && (
                        <span className={`pill ${capOk?"pill-cap-ok":"pill-cap-warn"}`}>{req.capacityCheck}</span>
                      )}
                    </div>
                  </div>

                  {/* Meta grid */}
                  <div className="meta-grid">
                    {[
                      ["Requester",        req.requesterName||"—"],
                      ["Est. Project Value",req.estimatedValue?`$${Number(req.estimatedValue).toLocaleString()}`:"—"],
                      ["Breakers Enable",   req.breakersEnable||"—"],
                      ["Drop-Dead Date",    req.dropDeadDate||"—"],
                      ["Qty Requested",     `${req.quantityNeeded} unit${req.quantityNeeded!==1?"s":""}`],
                      ["Units Selected",    `${req.breakerIds.length} unit${req.breakerIds.length!==1?"s":""}`],
                    ].map(([k,v])=>(
                      <div key={k}>
                        <div className="meta-lbl">{k}</div>
                        <div className="meta-val">{v}</div>
                      </div>
                    ))}
                  </div>

                  {/* Breaker units */}
                  <div className="breaker-section">
                    <div className="breaker-lbl">Requested Breaker Units</div>
                    {req.breakers.length===0 ? (
                      <div style={{ fontSize:12, color:"#94A3B8" }}>No breaker details available</div>
                    ) : req.breakers.map(b => {
                      const isAvail = b.status==="Available";
                      const isResv  = b.status==="Reserved";
                      return (
                        <div key={b.id} className={`breaker-row ${isAvail?"avail":isResv?"reserved-state":"unknown"}`}>
                          <div style={{ flex:1 }}>
                            <div className="breaker-name">{b.name}</div>
                            <div className="breaker-meta-text">
                              {[b.voltage&&`${b.voltage}kV`, b.manufacturer, b.deliveryDate&&`Delivery: ${b.deliveryDate}`].filter(Boolean).join(" · ")}
                            </div>
                          </div>
                          <span className={`b-pill ${isAvail?"g":isResv?"r":"u"}`}>{b.status||"Unknown"}</span>
                        </div>
                      );
                    })}
                  </div>

                  {/* Actions / result */}
                  {as.done ? (
                    as.outcome==="approved" ? (
                      <div className="approved-banner">
                        <div className="banner-icon" style={{ background:"#DCFCE7" }}>
                          <svg width="14" height="14" fill="none" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5" stroke="#166534" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
                        </div>
                        <div>
                          <div className="banner-title g">Approved — breakers moved to Pending Reservation. Mark as Reserved once the customer provides a PO.</div>
                          {as.error && <div className="banner-warn">Completed with warnings: {as.error}</div>}
                        </div>
                      </div>
                    ) : (
                      <div className="denied-banner">
                        <div className="banner-icon" style={{ background:"#FEE2E2" }}>
                          <svg width="14" height="14" fill="none" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12" stroke="#991B1B" strokeWidth="2.5" strokeLinecap="round"/></svg>
                        </div>
                        <div>
                          <div className="banner-title r">Denied — request closed</div>
                          <div className="banner-sub">A comment has been posted on the Monday.com item if a reason was provided.</div>
                        </div>
                      </div>
                    )
                  ) : (
                    <div className="action-bar">
                      {as.error && <div className="err-box" style={{ width:"100%", marginBottom:0 }}>{as.error}</div>}
                      <button onClick={()=>handleApprove(req)} disabled={!!as.working} className="btn-approve">
                        {as.working ? "Processing…" : "Approve"}
                      </button>
                      <button onClick={()=>{setDenyTarget(req);setDenyReason("");}} disabled={!!as.working} className="btn-deny">
                        Deny
                      </button>
                      <a href={`https://burnsmcd-inc.monday.com/boards/${REQUESTS_BOARD_ID}`}
                        target="_blank" rel="noreferrer" className="btn-view-link">
                        View in Monday.com →
                      </a>
                    </div>
                  )}
                </div>
              );
            })}

            {/* Queue section — backup requests, no action needed */}
            {queued.length > 0 && (
              <div style={{ marginTop:28 }}>
                <div className="section-row">
                  <div className="section-title">Queue</div>
                  <span className="count-pill" style={{ background:"#F1F5F9", color:"#475569" }}>{queued.length} backup request{queued.length!==1?"s":""}</span>
                </div>
                <div style={{ background:"#FFFBEB", border:"1px solid #FDE68A", borderRadius:10, padding:"12px 16px", marginBottom:14, fontSize:12, color:"#92400E", lineHeight:1.6 }}>
                  <strong>No action required.</strong> These requests are backups in case a primary request falls through. If the original requestor does not receive a customer PO, notify the next person in queue and approve their request at that time.
                </div>
                {queued.map(req => (
                  <div key={req.id} className="req-card" style={{ borderLeft:"4px solid #D97706", opacity:0.9 }}>
                    <div className="req-card-top">
                      <div>
                        <div className="req-opp">{req.opportunityNum||req.name}</div>
                        <div className="req-proj">{req.projectName} &mdash; <span className="req-client">{req.clientName}</span></div>
                      </div>
                      <div style={{ display:"flex", gap:8, flexShrink:0 }}>
                        <span className="pill" style={{ background:"#FEF3C7", color:"#92400E" }}>In Queue</span>
                        {req.capacityCheck && <span className={`pill ${req.capacityCheck==="Sufficient"?"pill-cap-ok":"pill-cap-warn"}`}>{req.capacityCheck}</span>}
                      </div>
                    </div>
                    <div className="meta-grid">
                      {[
                        ["Requester",        req.requesterName||"—"],
                        ["Est. Project Value",req.estimatedValue?`$${Number(req.estimatedValue).toLocaleString()}`:"—"],
                        ["Breakers Enable",   req.breakersEnable||"—"],
                        ["Drop-Dead Date",    req.dropDeadDate||"—"],
                        ["Qty Requested",     `${req.quantityNeeded} unit${req.quantityNeeded!==1?"s":""}`],
                        ["Opportunity #",     req.opportunityNum||"—"],
                      ].map(([k,v])=>(
                        <div key={k}><div className="meta-lbl">{k}</div><div className="meta-val">{v}</div></div>
                      ))}
                    </div>
                    <div className="breaker-section">
                      <div className="breaker-lbl">Queued Breaker Units</div>
                      {req.breakers.map(b => {
                        const ss = b.status==="Pending Review"?{color:"#92400E",bg:"#FEF3C7"}:b.status==="Pending Reservation"?{color:"#1D4ED8",bg:"#DBEAFE"}:{color:"#64748B",bg:"#F1F5F9"};
                        return (
                          <div key={b.id} className="breaker-row unknown">
                            <div style={{ flex:1 }}>
                              <div className="breaker-name">{b.name}</div>
                              <div className="breaker-meta-text">{[b.voltage&&`${b.voltage}kV`,b.manufacturer,b.deliveryDate&&`Delivery: ${b.deliveryDate}`].filter(Boolean).join(" · ")}</div>
                            </div>
                            <span className="b-pill" style={{ color:ss.color, background:ss.bg }}>{b.status||"Unknown"}</span>
                          </div>
                        );
                      })}
                    </div>
                    <div className="action-bar">
                      <span style={{ fontSize:12, color:"#94A3B8", fontStyle:"italic" }}>Awaiting outcome of primary request — no action needed at this time.</span>
                      <a href={`https://burnsmcd-inc.monday.com/boards/${REQUESTS_BOARD_ID}`} target="_blank" rel="noreferrer" className="btn-view-link">View in Monday.com →</a>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* Pending Reservation — awaiting customer PO */}
            {history.filter(r=>r.status==="Done" && r.breakers.some(b=>b.status==="Pending Reservation")).length > 0 && (
              <div style={{ marginTop:28 }}>
                <div className="section-row">
                  <div className="section-title">Pending Reservation</div>
                  <span className="count-pill" style={{ background:"#DBEAFE", color:"#1D4ED8" }}>Awaiting Customer PO</span>
                </div>
                {history.filter(r=>r.status==="Done" && r.breakers.some(b=>b.status==="Pending Reservation")).map(req=>{
                  const mrs = markReservedState[req.id]||{};
                  return (
                    <div key={req.id} className="req-card" style={{ borderLeft:"4px solid #1D4ED8" }}>
                      <div className="req-card-top">
                        <div>
                          <div className="req-opp">{req.opportunityNum||req.name}</div>
                          <div className="req-proj">{req.projectName} &mdash; <span className="req-client">{req.clientName}</span></div>
                        </div>
                        <span className="pill" style={{ background:"#DBEAFE", color:"#1D4ED8" }}>Pending Reservation</span>
                      </div>
                      <div className="meta-grid">
                        <div><div className="meta-lbl">Requester</div><div className="meta-val">{req.requesterName||"—"}</div></div>
                        <div><div className="meta-lbl">Opportunity #</div><div className="meta-val">{req.opportunityNum||"—"}</div></div>
                        <div><div className="meta-lbl">Units</div><div className="meta-val">{req.breakerIds.length} unit{req.breakerIds.length!==1?"s":""}</div></div>
                      </div>
                      <div className="action-bar">
                        {mrs.done ? (
                          <div style={{ color:"#1A9B5A", fontWeight:600, fontSize:12 }}>✓ Marked as Reserved — breakers are now fully locked.</div>
                        ) : (
                          <>
                            {mrs.error && <div className="err-box" style={{ width:"100%", marginBottom:0 }}>{mrs.error}</div>}
                            <button onClick={()=>handleMarkReserved(req)} disabled={!!mrs.working}
                              style={{ background:mrs.working?"#94A3B8":"#002D59", color:"#E6F001", border:"none", borderRadius:7, padding:"10px 22px", fontSize:13, fontWeight:700, cursor:mrs.working?"not-allowed":"pointer" }}>
                              {mrs.working ? "Processing…" : "Mark as Reserved — Customer PO Received"}
                            </button>
                            <span style={{ fontSize:11, color:"#94A3B8", marginLeft:4 }}>Click when customer PO is confirmed</span>
                          </>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            {/* History */}
            {history.length > 0 && (
              <div style={{ marginTop:28 }}>
                <div className="section-row">
                  <div className="section-title">Recent Decisions</div>
                  <span className="count-pill gray">{history.length} record{history.length!==1?"s":""}</span>
                </div>
                {history.map(req=>(
                  <div key={req.id} className="hist-card"
                    style={{ borderLeft:`4px solid ${req.status==="Done"?"#1A9B5A":"#DC2626"}` }}>
                    <div>
                      <div className="hist-opp">{req.opportunityNum||req.name}</div>
                      <div className="hist-meta">{req.projectName} &mdash; {req.clientName} &mdash; {req.breakerIds.length} unit{req.breakerIds.length!==1?"s":""}</div>
                    </div>
                    <span className={`pill ${req.status==="Done"?"pill-approved":"pill-denied"}`}>
                      {req.status==="Done" ? "Approved" : "Denied"}
                    </span>
                  </div>
                ))}
              </div>
            )}

            <div className="bmcd-footer" style={{ marginTop:32 }}>
              BURNS &amp; McDONNELL &nbsp;·&nbsp; BREAKER SLOT PROGRAM &nbsp;·&nbsp; CONFIDENTIAL — INTERNAL USE ONLY
            </div>
          </div>

          {/* Deny modal */}
          {denyTarget && (
            <div className="modal-overlay">
              <div className="modal-box">
                <div style={{ width:36, height:36, background:"#FEE2E2", borderRadius:"50%", display:"flex", alignItems:"center", justifyContent:"center", marginBottom:14 }}>
                  <svg width="16" height="16" fill="none" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12" stroke="#DC2626" strokeWidth="2.5" strokeLinecap="round"/></svg>
                </div>
                <div className="modal-title">Deny Request</div>
                <div className="modal-body">
                  Denying <strong>{denyTarget.opportunityNum||denyTarget.name}</strong>. Add an optional reason — it will be posted as a comment on the Monday.com item so the requester can see it.
                </div>
                <label className="bmcd-lbl">Reason (optional)</label>
                <textarea
                  value={denyReason}
                  onChange={e=>setDenyReason(e.target.value)}
                  placeholder="e.g. Insufficient project value to justify slot reservation at this stage."
                  rows={3}
                  className="modal-textarea"/>
                <div className="modal-actions">
                  <button onClick={()=>handleDeny(denyTarget,denyReason)} className="modal-confirm">Confirm Denial</button>
                  <button onClick={()=>{setDenyTarget(null);setDenyReason("");}} className="modal-cancel">Cancel</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App/>);
  </script>
</body>
</html>
