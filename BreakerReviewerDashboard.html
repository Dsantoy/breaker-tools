<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BSF Review Dashboard — Burns &amp; McDonnell</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #E2E8F0; font-family: system-ui, -apple-system, sans-serif; }
    select, input, textarea, button { font-family: inherit; }

    /* Header */
    .bmcd-header { background: #002D59; position: relative; overflow: hidden; padding: 20px 36px; display: flex; align-items: center; justify-content: space-between; }
    .bmcd-header::before { content:''; position:absolute; top:0;left:0;right:0;bottom:0;
      background-image: repeating-linear-gradient(-55deg,transparent,transparent 18px,rgba(0,73,205,0.3) 18px,rgba(0,73,205,0.3) 22px);
      pointer-events:none; }
    .bmcd-header-left { position:relative; z-index:1; display:flex; align-items:center; gap:14px; }
    .bmcd-header-right { position:relative; z-index:1; display:flex; gap:10px; }
    .bmcd-logo-wrap { background:rgba(255,255,255,.1); border-radius:10px; width:42px; height:42px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .bmcd-title { color:#fff; font-size:18px; font-weight:800; letter-spacing:.02em; }
    .bmcd-title-sub { color:rgba(255,255,255,.55); font-size:11px; margin-top:2px; letter-spacing:.04em; }
    .btn-header-outline { background:rgba(255,255,255,.1); color:#fff; border:1.5px solid rgba(255,255,255,.25); border-radius:7px; padding:8px 16px; font-size:12px; font-weight:600; cursor:pointer; }
    .btn-header-outline:disabled { opacity:.5; cursor:wait; }
    .btn-header-neon { background:#E6F001; color:#002D59; border:none; border-radius:7px; padding:8px 16px; font-size:12px; font-weight:800; cursor:pointer; }
    .btn-header-neon:disabled { opacity:.5; cursor:wait; }

    /* Stats bar */
    .stats-bar { background:#0049CD; padding:0 36px; display:flex; }
    .stat-item { padding:13px 32px 13px 0; border-right:1px solid rgba(255,255,255,.15); margin-right:32px; }
    .stat-item:last-child { border-right:none; }
    .stat-num { font-size:22px; font-weight:800; color:#E6F001; line-height:1; }
    .stat-lbl { font-size:9px; font-weight:700; color:rgba(255,255,255,.6); letter-spacing:.1em; text-transform:uppercase; margin-top:3px; }

    /* Main */
    .bmcd-main { padding:24px 36px; max-width:880px; margin:0 auto; }
    .section-row { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
    .section-title { font-size:14px; font-weight:700; color:#002D59; }
    .count-pill { font-size:11px; font-weight:700; padding:2px 9px; border-radius:99px; }
    .count-pill.amber { background:#FEF3C7; color:#92400E; }
    .count-pill.green { background:#DCFCE7; color:#166534; }
    .count-pill.gray  { background:#F1F5F9; color:#64748B; }

    /* Request cards */
    .req-card { background:#fff; border-radius:12px; border:1px solid #D4DCE6; box-shadow:0 2px 14px rgba(0,45,89,.07); margin-bottom:16px; overflow:hidden; }
    .req-card-top { padding:18px 22px; border-bottom:1px solid #EEF2F7; display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
    .req-opp { font-size:16px; font-weight:800; color:#002D59; }
    .req-proj { font-size:13px; color:#4D6680; margin-top:3px; }
    .req-client { color:#94A3B8; }
    .pill { font-size:10px; font-weight:700; padding:3px 10px; border-radius:99px; white-space:nowrap; flex-shrink:0; display:inline-flex; align-items:center; }
    .pill-pending  { background:#FEF3C7; color:#92400E; }
    .pill-approved { background:#DCFCE7; color:#166534; }
    .pill-denied   { background:#FEE2E2; color:#991B1B; }
    .pill-cap-ok   { background:#EEF3FC; color:#0049CD; }
    .pill-cap-warn { background:#FEF2F2; color:#991B1B; }

    /* Meta grid */
    .meta-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px 16px; padding:14px 22px; background:#F8FAFC; border-bottom:1px solid #EEF2F7; }
    .meta-lbl { font-size:9px; font-weight:700; color:#94A3B8; letter-spacing:.1em; text-transform:uppercase; margin-bottom:3px; }
    .meta-val { font-size:12px; font-weight:600; color:#002D59; }

    /* Breaker list */
    .breaker-section { padding:14px 22px; border-bottom:1px solid #EEF2F7; }
    .breaker-lbl { font-size:9px; font-weight:700; color:#94A3B8; letter-spacing:.1em; text-transform:uppercase; margin-bottom:8px; }
    .breaker-row { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:7px; margin-bottom:4px; }
    .breaker-row.avail { background:#F0FDF4; border:1px solid #BBF7D0; }
    .breaker-row.reserved-state { background:#FEF2F2; border:1px solid #FECACA; }
    .breaker-row.unknown { background:#F8FAFC; border:1px solid #D4DCE6; }
    .breaker-name { font-size:12px; font-weight:600; color:#002D59; flex:1; }
    .breaker-meta-text { font-size:11px; color:#94A3B8; margin-top:1px; }
    .b-pill { font-size:10px; font-weight:700; padding:2px 8px; border-radius:99px; flex-shrink:0; }
    .b-pill.g { background:#DCFCE7; color:#166534; }
    .b-pill.r { background:#FEE2E2; color:#991B1B; }
    .b-pill.u { background:#F1F5F9; color:#64748B; }

    /* Actions */
    .action-bar { padding:14px 22px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .btn-approve { background:#1A9B5A; color:#fff; border:none; border-radius:7px; padding:10px 22px; font-size:13px; font-weight:700; cursor:pointer; }
    .btn-approve:disabled { background:#94A3B8; cursor:not-allowed; }
    .btn-deny { background:#DC2626; color:#fff; border:none; border-radius:7px; padding:10px 22px; font-size:13px; font-weight:700; cursor:pointer; }
    .btn-deny:disabled { background:#94A3B8; cursor:not-allowed; }
    .btn-view-link { background:none; color:#0049CD; border:none; font-size:12px; font-weight:600; cursor:pointer; text-decoration:underline; margin-left:auto; }

    /* Result banners */
    .approved-banner { padding:14px 22px; background:#F0FDF4; border-top:3px solid #1A9B5A; display:flex; align-items:center; gap:12px; }
    .denied-banner   { padding:14px 22px; background:#FEF2F2; border-top:3px solid #DC2626; display:flex; align-items:center; gap:12px; }
    .banner-icon { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .banner-title { font-size:12px; font-weight:700; }
    .banner-title.g { color:#166534; }
    .banner-title.r { color:#991B1B; }
    .banner-sub { font-size:11px; color:#64748B; margin-top:2px; }
    .banner-warn { font-size:11px; color:#D97706; margin-top:4px; }

    /* Error box */
    .err-box { background:#FEF2F2; border:1px solid #FECACA; color:#DC2626; border-radius:8px; padding:10px 14px; font-size:12px; margin-bottom:10px; }

    /* Sync message */
    .sync-msg { border-radius:8px; padding:10px 16px; margin-bottom:14px; font-size:12px; font-weight:600; }
    .sync-msg.ok   { background:#F0FDF4; border:1px solid #86EFAC; color:#166534; }
    .sync-msg.fail { background:#FEF2F2; border:1px solid #FECACA; color:#DC2626; }

    /* History cards */
    .hist-card { background:#fff; border-radius:10px; border:1px solid #D4DCE6; padding:13px 18px; margin-bottom:8px; display:flex; align-items:center; justify-content:space-between; opacity:.88; }
    .hist-opp  { font-size:13px; font-weight:700; color:#002D59; }
    .hist-meta { font-size:11px; color:#94A3B8; margin-top:2px; }

    /* Setup */
    .setup-wrap { min-height:100vh; background:#E2E8F0; display:flex; align-items:center; justify-content:center; padding:24px; }
    .setup-box { background:#fff; border-radius:14px; box-shadow:0 4px 28px rgba(0,45,89,.12); padding:40px; max-width:470px; width:100%; }
    .setup-logo-row { display:flex; align-items:center; gap:13px; margin-bottom:6px; }
    .setup-divider { height:1px; background:#E8EDF4; margin:18px 0 22px; }
    .setup-inp { width:100%; padding:10px 13px; border:1.5px solid #D4DCE6; border-radius:7px; font-size:14px; color:#002D59; outline:none; background:#F8FAFB; margin-bottom:0; }
    .setup-inp:focus { border-color:#0049CD; background:#fff; box-shadow:0 0 0 3px rgba(0,73,205,.1); }
    .setup-hint { font-size:11px; color:#94A3B8; margin:4px 0 18px; }
    .setup-btn { background:#0049CD; color:#fff; border:none; border-radius:8px; padding:13px 24px; font-size:14px; font-weight:700; cursor:pointer; width:100%; }
    .setup-btn:disabled { opacity:.6; cursor:wait; }
    .bmcd-lbl { display:block; font-size:10px; font-weight:700; color:#4D6680; letter-spacing:.07em; text-transform:uppercase; margin-bottom:5px; }

    /* Deny modal */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; padding:24px; z-index:1000; }
    .modal-box { background:#fff; border-radius:14px; padding:32px; max-width:440px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.2); }
    .modal-title { font-size:17px; font-weight:800; color:#002D59; margin-bottom:6px; }
    .modal-body { font-size:13px; color:#4D6680; margin-bottom:20px; line-height:1.5; }
    .modal-textarea { width:100%; padding:10px 13px; border:1.5px solid #D4DCE6; border-radius:7px; font-size:13px; color:#002D59; outline:none; background:#F8FAFB; resize:vertical; margin-bottom:20px; }
    .modal-textarea:focus { border-color:#DC2626; background:#fff; }
    .modal-actions { display:flex; gap:10px; }
    .modal-confirm { background:#DC2626; color:#fff; border:none; border-radius:7px; padding:11px 22px; font-size:13px; font-weight:700; cursor:pointer; flex:1; }
    .modal-cancel { background:#F0F4F8; color:#334155; border:1.5px solid #D4DCE6; border-radius:7px; padding:11px 22px; font-size:13px; font-weight:600; cursor:pointer; flex:1; }

    /* Footer */
    .bmcd-footer { text-align:center; padding:16px 0 28px; font-size:10px; color:#94A3B8; letter-spacing:.07em; }

    /* Loading */
    .loading-state { text-align:center; padding:48px 0; color:#94A3B8; font-size:13px; }
    .empty-state { text-align:center; padding:32px 0; color:#94A3B8; font-size:13px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    const MONDAY_API        = "https://api.monday.com/v2";
    const REQUESTS_BOARD_ID = 18422875681;
    const SUBITEMS_BOARD_ID = 18426331487;
    const SLOT_BOARD_ID     = 18422871700;
    const SUMMARY_BOARD_ID  = 18426507360;
    const SUMMARY_ITEM = {
      "145": { available: 12799154965, reserved: 12799161604 },
      "245": { available: 12799175418, reserved: 12799161594 },
      "362": { available: 12799148221, reserved: 12799138949 },
    };
    const SUMMARY_COL = { count: "numeric_mm662sje" };

    async function gql(apiKey, query, variables = {}) {
      const res = await fetch(MONDAY_API, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: apiKey },
        body: JSON.stringify({ query, variables }),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      if (json.errors) throw new Error(json.errors[0].message);
      return json.data;
    }

    function colVal(cvs, id) { return cvs?.find(c=>c.id===id)?.text || ""; }
    function colRaw(cvs, id) { const r=cvs?.find(c=>c.id===id)?.value; try{return r?JSON.parse(r):null;}catch{return null;} }

    /* BMcD logo mark */
    const LogoMark = ({ size=28 }) => (
      <svg width={size} height={size} viewBox="0 0 28 28" fill="none">
        <path d="M5 22 L13 4" stroke="white" strokeWidth="4.5" strokeLinecap="round"/>
        <path d="M12 22 L20 4" stroke="white" strokeWidth="4.5" strokeLinecap="round"/>
        <path d="M2 13 L26 13" stroke="#E6F001" strokeWidth="3" strokeLinecap="round" opacity="0.9"/>
      </svg>
    );

    function App() {
      const [apiKey,      setApiKey]      = useState("");
      const [setupLoad,   setSetupLoad]   = useState(false);
      const [setupErr,    setSetupErr]    = useState("");
      const [screen,      setScreen]      = useState("setup");
      const [requests,    setRequests]    = useState({ pending:[], history:[] });
      const [loading,     setLoading]     = useState(false);
      const [loadErr,     setLoadErr]     = useState("");
      const [actionState, setActionState] = useState({});
      const [denyTarget,  setDenyTarget]  = useState(null);
      const [denyReason,  setDenyReason]  = useState("");
      const [syncing,     setSyncing]     = useState(false);
      const [syncMsg,     setSyncMsg]     = useState("");

      /* ── Connect ── */
      const handleSetup = async () => {
        if (!apiKey.trim()) { setSetupErr("API key is required."); return; }
        setSetupErr(""); setSetupLoad(true);
        try {
          await gql(apiKey, `{ me { id } }`);
          setScreen("dashboard");
          loadRequests(apiKey);
        } catch(e) { setSetupErr("Connection failed: "+e.message); }
        finally { setSetupLoad(false); }
      };

      /* ── Load requests ── */
      const loadRequests = useCallback(async (key = apiKey) => {
        setLoading(true); setLoadErr("");
        try {
          const boardData = await gql(key, `{
            boards(ids:[${REQUESTS_BOARD_ID}]) {
              items_page(limit:100) {
                items {
                  id name
                  column_values(ids:[
                    "text_mm5es7sz","short_texthrb2ladn","peopleda149l5r",
                    "short_textfukcenx9","numeric_mm5es9c9","status",
                    "number8jhwmqe9","single_selectjej2zay","date3z59ugdu",
                    "text_mm66tjan","board_relation_mm5e11py","formula_mm5s2fxb"
                  ]) { id text value }
                }
              }
            }
          }`);

          const allItems = boardData.boards[0].items_page.items;
          const pending  = allItems.filter(i=>colVal(i.column_values,"status")==="Working on it");
          const history  = allItems.filter(i=>["Done","Stuck"].includes(colVal(i.column_values,"status")));

          const allIds = [];
          pending.forEach(item => {
            colVal(item.column_values,"text_mm66tjan").split("|").filter(Boolean).forEach(id=>allIds.push(id));
          });
          const uniqueIds = [...new Set(allIds)].map(Number).filter(Boolean);

          let subMap = {};
          if (uniqueIds.length > 0) {
            const subData = await gql(key, `{ items(ids:[${uniqueIds.join(",")}]) { id name column_values(ids:["status","dropdown_mm65b542","dropdown_mm65c7mt","date_mm65h7tw"]) { id text } parent_item { id name } } }`);
            subData.items.forEach(si => {
              const cols = {};
              si.column_values.forEach(c=>{cols[c.id]=c.text;});
              subMap[si.id] = { id:si.id, name:si.name, status:cols["status"]||"", voltage:cols["dropdown_mm65b542"]||"", manufacturer:cols["dropdown_mm65c7mt"]||"", deliveryDate:cols["date_mm65h7tw"]||"", parentId:si.parent_item?.id };
            });
          }

          const enrich = item => {
            const cv = item.column_values;
            const ids = colVal(cv,"text_mm66tjan").split("|").filter(Boolean);
            const slotRaw    = colRaw(cv,"board_relation_mm5e11py");
            const slotId     = slotRaw?.linkedPulseIds?.[0]?.linkedPulseId || null;
            const reqRaw     = colRaw(cv,"peopleda149l5r");
            const requesterId= reqRaw?.personsAndTeams?.[0]?.id || null;
            return {
              id:item.id, name:item.name,
              projectName:   colVal(cv,"text_mm5es7sz"),
              clientName:    colVal(cv,"short_texthrb2ladn"),
              requesterName: colVal(cv,"peopleda149l5r"),
              requesterId,
              opportunityNum:colVal(cv,"short_textfukcenx9"),
              quantityNeeded:parseInt(colVal(cv,"numeric_mm5es9c9")||"0"),
              status:        colVal(cv,"status"),
              estimatedValue:colVal(cv,"number8jhwmqe9"),
              breakersEnable:colVal(cv,"single_selectjej2zay"),
              dropDeadDate:  colVal(cv,"date3z59ugdu"),
              capacityCheck: colVal(cv,"formula_mm5s2fxb"),
              breakerIds: ids,
              breakers: ids.map(id=>subMap[id]||{ id, name:`Unit ${id}`, status:"Unknown" }),
              slotId,
            };
          };

          setRequests({ pending:pending.map(enrich), history:history.slice(0,8).map(enrich) });
        } catch(e) { setLoadErr("Failed to load requests: "+e.message); }
        finally { setLoading(false); }
      }, [apiKey]);

      /* ── Sync counts ── */
      const syncAllCounts = async () => {
        setSyncing(true); setSyncMsg("");
        try {
          const data = await gql(apiKey, `{ boards(ids:[${SLOT_BOARD_ID}]) { items_page(limit:50) { items { id name subitems { id column_values(ids:["status"]) { id text } } } } } }`);
          const items = data.boards[0].items_page.items;
          let updated = 0;
          for (const item of items) {
            const reservedCount = (item.subitems||[]).filter(si=>si.column_values?.find(c=>c.id==="status")?.text==="Reserved").length;
            await gql(apiKey, `mutation($itemId:ID!,$boardId:ID!,$cv:JSON!){ change_multiple_column_values(item_id:$itemId,board_id:$boardId,column_values:$cv){ id } }`,
              { itemId:String(item.id), boardId:String(SLOT_BOARD_ID), cv:JSON.stringify({ numeric_mm5sw1t1:reservedCount }) });
            updated++;
          }
          const allSubData = await gql(apiKey, `{ boards(ids:[${SUBITEMS_BOARD_ID}]) { items_page(limit:200) { items { column_values(ids:["status","dropdown_mm65b542"]) { id text } } } } }`);
          const allSubItems = allSubData.boards[0].items_page.items;
          for (const v of ["145","245","362"]) {
            const forV  = allSubItems.filter(si=>si.column_values.find(c=>c.id==="dropdown_mm65b542")?.text===v);
            const avail2= forV.filter(si=>si.column_values.find(c=>c.id==="status")?.text==="Available").length;
            const resv2 = forV.filter(si=>si.column_values.find(c=>c.id==="status")?.text==="Reserved").length;
            const sids  = SUMMARY_ITEM[v];
            if (sids) {
              await gql(apiKey, `mutation($itemId:ID!,$boardId:ID!,$cv:JSON!){ change_multiple_column_values(item_id:$itemId,board_id:$boardId,column_values:$cv){ id } }`,
                { itemId:String(sids.available), boardId:String(SUMMARY_BOARD_ID), cv:JSON.stringify({ [SUMMARY_COL.count]:avail2 }) });
              await gql(apiKey, `mutation($itemId:ID!,$boardId:ID!,$cv:JSON!){ change_multiple_column_values(item_id:$itemId,board_id:$boardId,column_values:$cv){ id } }`,
                { itemId:String(sids.reserved), boardId:String(SUMMARY_BOARD_ID), cv:JSON.stringify({ [SUMMARY_COL.count]:resv2 }) });
            }
          }
          setSyncMsg(`Synced ${updated} PO lines and capacity summary.`);
          setTimeout(()=>setSyncMsg(""), 6000);
        } catch(e) { setSyncMsg("Sync failed: "+e.message); }
        finally { setSyncing(false); }
      };

      /* ── Approve ── */
      const handleApprove = async req => {
        setActionState(p=>({...p,[req.id]:{working:true,error:null,done:false}}));
        const errs = [];
        try {
          for (const breakerId of req.breakerIds) {
            const bid = parseInt(breakerId);
            if (!bid) continue;
            try {
              const cv = { status:{ label:"Pending Reservation" }, text_mm65z5wm:req.opportunityNum };
              if (req.requesterId) cv.person = { personsAndTeams:[{ id:parseInt(req.requesterId), kind:"person" }] };
              await gql(apiKey, `mutation($itemId:ID!,$boardId:ID!,$cv:JSON!){ change_multiple_column_values(item_id:$itemId,board_id:$boardId,column_values:$cv){ id } }`,
                { itemId:String(bid), boardId:String(SUBITEMS_BOARD_ID), cv:JSON.stringify(cv) });
            } catch(e) { errs.push(`Unit ${breakerId}: ${e.message}`); }
          }
          if (req.slotId) {
            try {
              const siData = await gql(apiKey, `{ items(ids:[${req.slotId}]) { subitems { id column_values(ids:["status"]) { id text } } } }`);
              const allSubs = siData.items?.[0]?.subitems||[];
              const reservedCount = allSubs.filter(si=>si.column_values?.find(c=>c.id==="status")?.text==="Reserved").length;
              await gql(apiKey, `mutation($itemId:ID!,$boardId:ID!,$cv:JSON!){ change_multiple_column_values(item_id:$itemId,board_id:$boardId,column_values:$cv){ id } }`,
                { itemId:String(req.slotId), boardId:String(SLOT_BOARD_ID), cv:JSON.stringify({ numeric_mm5sw1t1:reservedCount }) });
            } catch(e) { errs.push("Reserved Qty sync: "+e.message); }
          }
          try {
            for (const v of ["145","245","362"]) {
              const vRowIds = SUMMARY_ITEM[v];
              if (!vRowIds) continue;
              const vData = await gql(apiKey, `{ boards(ids:[${SUBITEMS_BOARD_ID}]) { items_page(limit:200) { items { column_values(ids:["status","dropdown_mm65b542"]) { id text } } } } }`);
              const vItems = vData.boards[0].items_page.items;
              const forV   = vItems.filter(si=>si.column_values.find(c=>c.id==="dropdown_mm65b542")?.text===v);
              const avail  = forV.filter(si=>si.column_values.find(c=>c.id==="status")?.text==="Available").length;
              const resv   = forV.filter(si=>si.column_values.find(c=>c.id==="status")?.text==="Reserved").length;
              await gql(apiKey, `mutation($itemId:ID!,$boardId:ID!,$cv:JSON!){ change_multiple_column_values(item_id:$itemId,board_id:$boardId,column_values:$cv){ id } }`,
                { itemId:String(vRowIds.available), boardId:String(SUMMARY_BOARD_ID), cv:JSON.stringify({ [SUMMARY_COL.count]:avail }) });
              await gql(apiKey, `mutation($itemId:ID!,$boardId:ID!,$cv:JSON!){ change_multiple_column_values(item_id:$itemId,board_id:$boardId,column_values:$cv){ id } }`,
                { itemId:String(vRowIds.reserved), boardId:String(SUMMARY_BOARD_ID), cv:JSON.stringify({ [SUMMARY_COL.count]:resv }) });
            }
          } catch(e) { errs.push("Summary sync: "+e.message); }
          await gql(apiKey, `mutation($itemId:ID!,$boardId:ID!,$cv:JSON!){ change_multiple_column_values(item_id:$itemId,board_id:$boardId,column_values:$cv){ id } }`,
            { itemId:String(req.id), boardId:String(REQUESTS_BOARD_ID), cv:JSON.stringify({ status:{ label:"Done" } }) });
          setActionState(p=>({...p,[req.id]:{ working:false, error:errs.length?errs.join("; "):null, done:true, outcome:"approved" }}));
          setTimeout(()=>loadRequests(), 1800);
        } catch(e) {
          setActionState(p=>({...p,[req.id]:{ working:false, error:"Approval failed: "+e.message, done:false }}));
        }
      };

      /* ── Deny ── */
      const handleDeny = async (req, reason) => {
        setDenyTarget(null); setDenyReason("");
        setActionState(p=>({...p,[req.id]:{working:true,error:null,done:false}}));
        try {
          await gql(apiKey, `mutation($itemId:ID!,$boardId:ID!,$cv:JSON!){ change_multiple_column_values(item_id:$itemId,board_id:$boardId,column_values:$cv){ id } }`,
            { itemId:String(req.id), boardId:String(REQUESTS_BOARD_ID), cv:JSON.stringify({ status:{ label:"Stuck" } }) });
          if (reason.trim()) {
            await gql(apiKey, `mutation($itemId:ID!,$body:String!){ create_update(item_id:$itemId,body:$body){ id } }`,
              { itemId:parseInt(req.id), body:"Request denied.\n\nReason: "+reason });
          }
          setActionState(p=>({...p,[req.id]:{ working:false, error:null, done:true, outcome:"denied" }}));
          setTimeout(()=>loadRequests(), 1800);
        } catch(e) {
          setActionState(p=>({...p,[req.id]:{ working:false, error:"Denial failed: "+e.message, done:false }}));
        }
      };

      /* ── SETUP SCREEN ── */
      if (screen==="setup") return (
        <div className="setup-wrap">
          <div className="setup-box">
            <div className="setup-logo-row">
              <div style={{ background:"#002D59", borderRadius:10, width:42, height:42, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
                <LogoMark/>
              </div>
              <div>
                <div style={{ fontSize:16, fontWeight:800, color:"#002D59", letterSpacing:".03em" }}>BURNS &amp; McDONNELL</div>
                <div style={{ fontSize:11, color:"#94A3B8", marginTop:2 }}>BSF Review Dashboard</div>
              </div>
            </div>
            <div className="setup-divider"/>
            <p style={{ color:"#4D6680", fontSize:13, marginBottom:22, lineHeight:1.6 }}>
              Reviewer-only tool. Approving a request automatically marks all selected breaker units as Reserved in Monday.com, updates the slot Reserved Qty, and writes the opportunity number to each unit.
            </p>
            <label className="bmcd-lbl">Monday.com API Key <span style={{ color:"#DC2626" }}>*</span></label>
            <input type="password" value={apiKey} onChange={e=>setApiKey(e.target.value)}
              onKeyDown={e=>e.key==="Enter"&&handleSetup()}
              placeholder="eyJhbGciOiJIUzI1Ni..." className="setup-inp"/>
            <div className="setup-hint">Profile → Developers → My Access Tokens</div>
            {setupErr && <div className="err-box">{setupErr}</div>}
            <button onClick={handleSetup} disabled={setupLoad} className="setup-btn">
              {setupLoad ? "Connecting…" : "Open Review Dashboard →"}
            </button>
          </div>
        </div>
      );

      /* ── DASHBOARD ── */
      const { pending=[], history=[] } = requests;
      const totalReserved = history.filter(r=>r.status==="Done").length;

      return (
        <div style={{ minHeight:"100vh", background:"#E2E8F0", paddingBottom:40 }}>

          {/* Header */}
          <div className="bmcd-header">
            <div className="bmcd-header-left">
              <div className="bmcd-logo-wrap"><LogoMark/></div>
              <div>
                <div className="bmcd-title">BSF Review Dashboard</div>
                <div className="bmcd-title-sub">BURNS &amp; McDONNELL &nbsp;·&nbsp; HV CIRCUIT BREAKER SLOT PROGRAM</div>
              </div>
            </div>
            <div className="bmcd-header-right">
              <button onClick={syncAllCounts} disabled={syncing||loading} className="btn-header-outline">
                {syncing ? "Syncing…" : "Sync Counts"}
              </button>
              <button onClick={()=>loadRequests()} disabled={loading} className="btn-header-neon">
                {loading ? "Loading…" : "Refresh"}
              </button>
            </div>
          </div>

          {/* Stats bar */}
          <div className="stats-bar">
            <div className="stat-item">
              <div className="stat-num">{loading?"…":pending.length}</div>
              <div className="stat-lbl">Pending Review</div>
            </div>
            <div className="stat-item">
              <div className="stat-num">{loading?"…":history.length}</div>
              <div className="stat-lbl">Total Decisions</div>
            </div>
            <div className="stat-item">
              <div className="stat-num">120</div>
              <div className="stat-lbl">Total Program Units</div>
            </div>
          </div>

          {/* Main content */}
          <div className="bmcd-main">

            {syncMsg && (
              <div className={`sync-msg ${syncMsg.startsWith("Synced")?"ok":"fail"}`}>{syncMsg}</div>
            )}
            {loadErr && <div className="err-box">{loadErr}</div>}

            {/* Pending section */}
            <div className="section-row">
              <div className="section-title">Pending Review</div>
              <span className="count-pill amber">{loading?"…":pending.length} request{pending.length!==1?"s":""}</span>
              {!loading && pending.length===0 && <span style={{ fontSize:12, color:"#94A3B8" }}>— All caught up</span>}
            </div>

            {loading && <div className="loading-state">Loading requests from Monday.com…</div>}

            {!loading && pending.length===0 && (
              <div className="empty-state">No pending requests at this time.</div>
            )}

            {pending.map(req => {
              const as = actionState[req.id]||{};
              const capOk = req.capacityCheck==="Sufficient";
              return (
                <div key={req.id} className="req-card"
                  style={{ borderLeft:`4px solid ${as.done?(as.outcome==="approved"?"#1A9B5A":"#DC2626"):"#E6A000"}` }}>

                  {/* Card top */}
                  <div className="req-card-top">
                    <div>
                      <div className="req-opp">{req.opportunityNum||req.name}</div>
                      <div className="req-proj">{req.projectName} &mdash; <span className="req-client">{req.clientName}</span></div>
                    </div>
                    <div style={{ display:"flex", gap:8, flexShrink:0, flexWrap:"wrap", justifyContent:"flex-end" }}>
                      <span className="pill pill-pending">Pending Review</span>
                      {req.capacityCheck && (
                        <span className={`pill ${capOk?"pill-cap-ok":"pill-cap-warn"}`}>{req.capacityCheck}</span>
                      )}
                    </div>
                  </div>

                  {/* Meta grid */}
                  <div className="meta-grid">
                    {[
                      ["Requester",        req.requesterName||"—"],
                      ["Est. Project Value",req.estimatedValue?`$${Number(req.estimatedValue).toLocaleString()}`:"—"],
                      ["Breakers Enable",   req.breakersEnable||"—"],
                      ["Drop-Dead Date",    req.dropDeadDate||"—"],
                      ["Qty Requested",     `${req.quantityNeeded} unit${req.quantityNeeded!==1?"s":""}`],
                      ["Units Selected",    `${req.breakerIds.length} unit${req.breakerIds.length!==1?"s":""}`],
                    ].map(([k,v])=>(
                      <div key={k}>
                        <div className="meta-lbl">{k}</div>
                        <div className="meta-val">{v}</div>
                      </div>
                    ))}
                  </div>

                  {/* Breaker units */}
                  <div className="breaker-section">
                    <div className="breaker-lbl">Requested Breaker Units</div>
                    {req.breakers.length===0 ? (
                      <div style={{ fontSize:12, color:"#94A3B8" }}>No breaker details available</div>
                    ) : req.breakers.map(b => {
                      const isAvail = b.status==="Available";
                      const isResv  = b.status==="Reserved";
                      return (
                        <div key={b.id} className={`breaker-row ${isAvail?"avail":isResv?"reserved-state":"unknown"}`}>
                          <div style={{ flex:1 }}>
                            <div className="breaker-name">{b.name}</div>
                            <div className="breaker-meta-text">
                              {[b.voltage&&`${b.voltage}kV`, b.manufacturer, b.deliveryDate&&`Delivery: ${b.deliveryDate}`].filter(Boolean).join(" · ")}
                            </div>
                          </div>
                          <span className={`b-pill ${isAvail?"g":isResv?"r":"u"}`}>{b.status||"Unknown"}</span>
                        </div>
                      );
                    })}
                  </div>

                  {/* Actions / result */}
                  {as.done ? (
                    as.outcome==="approved" ? (
                      <div className="approved-banner">
                        <div className="banner-icon" style={{ background:"#DCFCE7" }}>
                          <svg width="14" height="14" fill="none" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5" stroke="#166534" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
                        </div>
                        <div>
                          <div className="banner-title g">Approved — breakers moved to Pending Reservation. Mark as Reserved once the customer provides a PO.</div>
                          {as.error && <div className="banner-warn">Completed with warnings: {as.error}</div>}
                        </div>
                      </div>
                    ) : (
                      <div className="denied-banner">
                        <div className="banner-icon" style={{ background:"#FEE2E2" }}>
                          <svg width="14" height="14" fill="none" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12" stroke="#991B1B" strokeWidth="2.5" strokeLinecap="round"/></svg>
                        </div>
                        <div>
                          <div className="banner-title r">Denied — request closed</div>
                          <div className="banner-sub">A comment has been posted on the Monday.com item if a reason was provided.</div>
                        </div>
                      </div>
                    )
                  ) : (
                    <div className="action-bar">
                      {as.error && <div className="err-box" style={{ width:"100%", marginBottom:0 }}>{as.error}</div>}
                      <button onClick={()=>handleApprove(req)} disabled={!!as.working} className="btn-approve">
                        {as.working ? "Processing…" : "Approve"}
                      </button>
                      <button onClick={()=>{setDenyTarget(req);setDenyReason("");}} disabled={!!as.working} className="btn-deny">
                        Deny
                      </button>
                      <a href={`https://burnsmcd-inc.monday.com/boards/${REQUESTS_BOARD_ID}`}
                        target="_blank" rel="noreferrer" className="btn-view-link">
                        View in Monday.com →
                      </a>
                    </div>
                  )}
                </div>
              );
            })}

            {/* Pending Reservation — awaiting customer PO */}
            {history.filter(r=>r.status==="Done" && r.breakers.some(b=>b.status==="Pending Reservation")).length > 0 && (
              <div style={{ marginTop:28 }}>
                <div className="section-row">
                  <div className="section-title">Pending Reservation</div>
                  <span className="count-pill" style={{ background:"#DBEAFE", color:"#1D4ED8" }}>Awaiting Customer PO</span>
                </div>
                {history.filter(r=>r.status==="Done" && r.breakers.some(b=>b.status==="Pending Reservation")).map(req=>{
                  const mrs = markReservedState[req.id]||{};
                  return (
                    <div key={req.id} className="req-card" style={{ borderLeft:"4px solid #1D4ED8" }}>
                      <div className="req-card-top">
                        <div>
                          <div className="req-opp">{req.opportunityNum||req.name}</div>
                          <div className="req-proj">{req.projectName} &mdash; <span className="req-client">{req.clientName}</span></div>
                        </div>
                        <span className="pill" style={{ background:"#DBEAFE", color:"#1D4ED8" }}>Pending Reservation</span>
                      </div>
                      <div className="meta-grid">
                        <div><div className="meta-lbl">Requester</div><div className="meta-val">{req.requesterName||"—"}</div></div>
                        <div><div className="meta-lbl">Opportunity #</div><div className="meta-val">{req.opportunityNum||"—"}</div></div>
                        <div><div className="meta-lbl">Units</div><div className="meta-val">{req.breakerIds.length} unit{req.breakerIds.length!==1?"s":""}</div></div>
                      </div>
                      <div className="action-bar">
                        {mrs.done ? (
                          <div style={{ color:"#1A9B5A", fontWeight:600, fontSize:12 }}>✓ Marked as Reserved — breakers are now fully locked.</div>
                        ) : (
                          <>
                            {mrs.error && <div className="err-box" style={{ width:"100%", marginBottom:0 }}>{mrs.error}</div>}
                            <button onClick={()=>handleMarkReserved(req)} disabled={!!mrs.working}
                              style={{ background:mrs.working?"#94A3B8":"#002D59", color:"#E6F001", border:"none", borderRadius:7, padding:"10px 22px", fontSize:13, fontWeight:700, cursor:mrs.working?"not-allowed":"pointer" }}>
                              {mrs.working ? "Processing…" : "Mark as Reserved — Customer PO Received"}
                            </button>
                            <span style={{ fontSize:11, color:"#94A3B8", marginLeft:4 }}>Click when customer PO is confirmed</span>
                          </>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            {/* History */}
            {history.length > 0 && (
              <div style={{ marginTop:28 }}>
                <div className="section-row">
                  <div className="section-title">Recent Decisions</div>
                  <span className="count-pill gray">{history.length} record{history.length!==1?"s":""}</span>
                </div>
                {history.map(req=>(
                  <div key={req.id} className="hist-card"
                    style={{ borderLeft:`4px solid ${req.status==="Done"?"#1A9B5A":"#DC2626"}` }}>
                    <div>
                      <div className="hist-opp">{req.opportunityNum||req.name}</div>
                      <div className="hist-meta">{req.projectName} &mdash; {req.clientName} &mdash; {req.breakerIds.length} unit{req.breakerIds.length!==1?"s":""}</div>
                    </div>
                    <span className={`pill ${req.status==="Done"?"pill-approved":"pill-denied"}`}>
                      {req.status==="Done" ? "Approved" : "Denied"}
                    </span>
                  </div>
                ))}
              </div>
            )}

            <div className="bmcd-footer" style={{ marginTop:32 }}>
              BURNS &amp; McDONNELL &nbsp;·&nbsp; BREAKER SLOT PROGRAM &nbsp;·&nbsp; CONFIDENTIAL — INTERNAL USE ONLY
            </div>
          </div>

          {/* Deny modal */}
          {denyTarget && (
            <div className="modal-overlay">
              <div className="modal-box">
                <div style={{ width:36, height:36, background:"#FEE2E2", borderRadius:"50%", display:"flex", alignItems:"center", justifyContent:"center", marginBottom:14 }}>
                  <svg width="16" height="16" fill="none" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12" stroke="#DC2626" strokeWidth="2.5" strokeLinecap="round"/></svg>
                </div>
                <div className="modal-title">Deny Request</div>
                <div className="modal-body">
                  Denying <strong>{denyTarget.opportunityNum||denyTarget.name}</strong>. Add an optional reason — it will be posted as a comment on the Monday.com item so the requester can see it.
                </div>
                <label className="bmcd-lbl">Reason (optional)</label>
                <textarea
                  value={denyReason}
                  onChange={e=>setDenyReason(e.target.value)}
                  placeholder="e.g. Insufficient project value to justify slot reservation at this stage."
                  rows={3}
                  className="modal-textarea"/>
                <div className="modal-actions">
                  <button onClick={()=>handleDeny(denyTarget,denyReason)} className="modal-confirm">Confirm Denial</button>
                  <button onClick={()=>{setDenyTarget(null);setDenyReason("");}} className="modal-cancel">Cancel</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App/>);
  </script>
</body>
</html>
